<style>
:root{

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.app{padding-bottom:92px}
header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:1.2rem;font-weight:800;letter-spacing:-.03em}
.header-actions{display:flex;gap:14px}.header-actions button{border:0;background:none;font-size:1.1rem}
.view{display:none}.view.active{display:block}
.hero{padding:20px}
.hero-card{background:linear-gradient(135deg,#fff,#f2f2f2);border:1px solid var(--line);border-radius:28px;padding:28px 22px;min-height:220px;display:flex;flex-direction:column;justify-content:flex-end}
.hero-card h1{font-size:2.2rem;line-height:1;letter-spacing:-.05em;margin-bottom:10px}
.hero-card p{font-size:.92rem;color:var(--sub);margin-bottom:18px}
.hero-btn,.btn-dark{height:48px;border:0;border-radius:999px;background:#111;color:#fff;font-weight:800;padding:0 18px}
.section{padding:0 20px 28px}.pad-top{padding-top:20px}
.section-title{font-size:1rem;font-weight:800;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card{background:var(--card);border-radius:22px;overflow:hidden;border:1px solid #ececec;cursor:pointer}
.thumb{aspect-ratio:1/1;background:#e8e8ec;display:flex;align-items:center;justify-content:center;font-size:2rem;overflow:hidden}
.thumb img,.detail-thumb img,.detail-img img,.post-mini img{width:100%;height:100%;object-fit:cover}
.info{padding:12px}.title{font-size:.9rem;font-weight:800;line-height:1.35;margin-bottom:4px}.meta{font-size:.75rem;color:var(--sub)}
.list{padding:0 20px 28px;display:flex;flex-direction:column;gap:12px}
.list-card,.notice-card,.my-row{background:var(--card);border:1px solid #ececec;border-radius:20px;cursor:pointer}
.list-card,.notice-card{padding:14px;display:flex;gap:12px;align-items:center}
.post-mini{width:54px;height:54px;border-radius:16px;background:#e8e8ec;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.list-main,.notice-body{flex:1;min-width:0}.list-title,.notice-title{font-size:.92rem;font-weight:800}.list-text{font-size:.82rem;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notice-meta{font-size:.74rem;color:var(--sub)}
.my-menu{padding:0 20px 28px}.my-row{padding:17px 16px;margin-bottom:10px;font-size:.92rem;font-weight:800;display:flex;justify-content:space-between}.logout{color:var(--danger)}
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;height:74px;background:rgba(255,255,255,.95);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;z-index:200}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.62rem;color:var(--sub);font-weight:600;border:0;background:none;font-family:inherit}.nav-item.active{color:#111}
.upload-btn{position:fixed;right:20px;bottom:96px;width:58px;height:58px;border-radius:50%;border:0;background:#111;color:#fff;font-size:1.8rem;box-shadow:0 10px 30px rgba(0,0,0,.15);z-index:150}
.detail-wrap{padding:20px}.back{border:0;background:none;font-size:.85rem;font-weight:800;margin-bottom:14px;color:#555}
.detail-main{background:var(--card);border:1px solid #ececec;border-radius:24px;padding:18px}
.detail-thumb{width:100%;aspect-ratio:1;border-radius:20px;background:#e8e8ec;display:flex;align-items:center;justify-content:center;font-size:3rem;overflow:hidden;margin-bottom:16px}
.detail-title{font-size:1.28rem;font-weight:900;margin-bottom:8px}.detail-price{font-size:1.1rem;font-weight:900;margin-bottom:14px}
.detail-body{font-size:.92rem;line-height:1.65;color:#444;white-space:pre-line}.detail-img{width:100%;border-radius:18px;overflow:hidden;background:#eee;margin-top:14px}.detail-img:empty{display:none}
.actions-bottom{padding-top:18px;display:flex;gap:10px;flex-wrap:wrap}
.btn{height:46px;border-radius:999px;border:0;font-weight:800;padding:0 18px;font-family:inherit}.btn-light{background:#fff;border:1px solid var(--line);color:#111}.btn-danger{background:var(--danger);color:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:300;display:none;align-items:flex-end}.modal.open{display:flex}
.sheet{width:100%;background:#fff;border-radius:24px 24px 0 0;padding:20px}.sheet-title{font-weight:900;margin-bottom:14px}
.input,.textarea{width:100%;border:1px solid var(--line);border-radius:16px;background:#fff;padding:14px;font-family:inherit;font-size:.9rem;margin-bottom:10px}.textarea{min-height:120px;resize:vertical}
.thumb-preview{height:92px;border-radius:18px;background:#f1f1f1;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:10px;color:#888;font-size:.85rem}.thumb-preview img{width:100%;height:100%;object-fit:cover}
.member-head{display:flex;align-items:center;gap:10px;padding:24px 20px 8px}.member-head h1{font-size:2rem;font-weight:900}.pill{background:#eee;border-radius:999px;padding:6px 10px;font-size:.8rem;font-weight:800}
.member-wrap{padding:34px 20px;text-align:center}.flip{perspective:1200px}
.membership-card{width:78%;max-width:330px;aspect-ratio:.72/1;margin:0 auto 28px;position:relative;transform-style:preserve-3d;transition:.5s}.membership-card.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;border-radius:28px;backface-visibility:hidden;box-shadow:0 22px 42px rgba(0,0,0,.08);overflow:hidden}
.card-front{background:linear-gradient(135deg,#fff,#eef2f9,#fff);display:flex;align-items:center;justify-content:center;color:#aaa;font-weight:900;font-size:1.25rem;padding:24px}
.card-back{background:#f2f1fa;transform:rotateY(180deg);display:flex;text-align:left}.card-back:before{content:'';width:28%;background:rgba(0,0,0,.04);border-right:1px solid rgba(0,0,0,.06)}
.card-back-inner{padding:28px 22px;flex:1}.small-label{font-size:.82rem;margin-top:18px}.big-info{font-size:1.35rem;font-weight:900;margin-top:5px;word-break:break-all}
.blue-btn{width:100%;height:64px;border-radius:14px;background:var(--blue);color:#fff;border:0;font-weight:900;font-size:1.18rem}
@media(min-width:900px){body{background:#efefef}.app{max-width:500px;margin:0 auto;background:#fff;min-height:100vh;position:relative;box-shadow:0 0 40px rgba(0,0,0,.06)}.bottom-nav{left:50%;transform:translateX(-50%);max-width:500px}.upload-btn{right:calc(50% - 230px)}.modal{left:50%;transform:translateX(-50%);max-width:500px}}
</style>
</head>

<section class="view" id="page-my-detail"><div class="detail-wrap" id="my-detail"></div></section>

</main>
<button class="upload-btn" onclick="openAddPost()">＋</button>
<nav class="bottom-nav">
  <button class="nav-item active" data-page="home" onclick="switchPage('home')">🏠<span>HOME</span></button>
  <button class="nav-item" data-page="talk" onclick="switchPage('talk')">💬<span>TALK</span></button>
  <button class="nav-item" data-page="contents" onclick="switchPage('contents')">▶️<span>CONTENTS</span></button>
  <button class="nav-item" data-page="shop" onclick="switchPage('shop')">🛍️<span>SHOP</span></button>
  <button class="nav-item" data-page="notice" onclick="switchPage('notice')">🔔<span>NOTICE</span></button>
  <button class="nav-item" data-page="my" onclick="switchPage('my')">👤<span>MY</span></button>
</nav>
</div>
<div class="modal" id="modal">
  <div class="sheet">
    <div class="sheet-title" id="modal-title">추가</div>
    <div id="thumb-area">
      <div class="thumb-preview" id="modal-thumb-preview">썸네일 없음</div>
      <button class="btn btn-light" style="width:100%;margin-bottom:10px" onclick="pickModalThumb()">썸네일 이미지 첨부</button>
    </div>
    <input class="input" id="modal-title-input">
    <textarea class="textarea" id="modal-body-input"></textarea>
    <input class="input" id="modal-price-input">

      <button class="btn btn-dark" id="modal-save" onclick="saveModal()">저장</button>
      <button class="btn btn-light" onclick="closeModal()">취소</button>
    </div>
  </div>
</div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
const firebaseConfig = {
  apiKey: "AIzaSyAA6mbdYfLrrgCJjN47PX91_mU7I53RiBs",
  authDomain: "site-c67b4.firebaseapp.com",
  projectId: "site-c67b4",
  storageBucket: "site-c67b4.firebasestorage.app",
  messagingSenderId: "744761377245",
  appId: "1:744761377245:web:3ddaee14f184716eeef634"
};
const CLOUDINARY_CLOUD = 'dbljkloal';
const CLOUDINARY_PRESET = 'clowofficial';
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let modalMode = 'post';
let editingProductId = null;
let editingPostId = null;
let editingNoticeId = null;
let modalThumb = '';
let profile = JSON.parse(localStorage.getItem('profile') || 'null') || {
  nickname:'', name:'', birth:'', phone:''
};
let membership = JSON.parse(localStorage.getItem('membership') || 'null') || null;
let orders = JSON.parse(localStorage.getItem('orders') || '[]');
let products = JSON.parse(localStorage.getItem('products') || 'null') || [
  {
    id:1,
    thumb:'💎',
    name:'ATINY MEMBERSHIP (단건 결제)',
    price:'20,000원 · 멤버십',
    detail:'멤버십 결제 상품입니다. 결제하기를 누르면 이름, 생년월일, 전화번호 입력창이 먼저 뜨고, 최종 결제 진행 후 1년 멤버십 카드가 생성됩니다.',
    detailImg:'',
    membership:true
  },
  {id:2,thumb:'📹',name:'ATINY 7TH KIT VOD ONLY',price:'7,000원',detail:'VOD ONLY 상품입니다.',detailImg:''},
  {id:3,thumb:'💿',name:'GOLDEN HOUR Pt.4 Album',price:'18,000원',detail:'앨범 상품 상세페이지입니다.',detailImg:''},
  {id:4,thumb:'🧸',name:'ANITEEZ Figure Set',price:'35,000원',detail:'굿즈 상품 상세페이지입니다.',detailImg:''}
];
let notices = JSON.parse(localStorage.getItem('notices') || 'null') || [
  {id:1,title:'ATEEZ(에이티즈) 편지 전달 주소 안내',meta:'KQ엔터테인먼트 · 3년 전',body:'팬레터 전달 주소 및 유의사항 안내입니다.',thumb:'📮'},
  {id:2,title:'ATEEZ(에이티즈) 오피셜 플랫폼 오픈 안내',meta:'KQ엔터테인먼트 · 3년 전',body:'ATEEZ 공식 플랫폼이 오픈되었습니다.',thumb:'📢'}
];
let posts = JSON.parse(localStorage.getItem('posts') || 'null') || [
  {id:1,type:'talk',title:'홍중 ✔',body:'우리 티니들 오늘도 화이팅! 💪',thumb:'🎤'},
  {id:2,type:'content',title:'Golden Hour Behind',body:'YouTube · 08:21',thumb:'🎬'}
];
function save(){
  localStorage.setItem('products', JSON.stringify(products));
  localStorage.setItem('notices', JSON.stringify(notices));
  localStorage.setItem('posts', JSON.stringify(posts));
  localStorage.setItem('profile', JSON.stringify(profile));
  localStorage.setItem('membership', JSON.stringify(membership));
  localStorage.setItem('orders', JSON.stringify(orders));
}
function media(v){
  return v && String(v).startsWith('http') ? `<img src="${v}">` : (v || '＋');
}
function render(){
  renderHome();
  renderShop();
  renderNotice();
  renderPosts();
  renderProfile();
  save();
}
function renderProfile(){
  document.getElementById('my-nickname').textContent = profile.nickname || '닉네임 미설정';
  document.getElementById('home-profile').textContent = profile.nickname ? `${profile.nickname}님 환영합니다` : 'ATEEZ Official Platform · White Edition';
}
function renderHome(){
  document.getElementById('home-grid').innerHTML = posts
    .filter(p => p.type === 'content')
    .slice(0,4)
    .map(p => `
      <div class="card" onclick="openPost(${p.id})">
        <div class="thumb">${media(p.thumb)}</div>
        <div class="info"><div class="title">${p.title}</div><div class="meta">${p.body}</div></div>
      </div>
    `).join('') || '<div class="meta">콘텐츠가 없습니다.</div>';
}
function renderShop(){
  document.getElementById('shop-grid').innerHTML = products.map(p => `
    <div class="card" onclick="openProduct(${p.id})">
      <div class="thumb">${media(p.thumb)}</div>
      <div class="info"><div class="title">${p.name}</div><div class="meta">${p.price}</div></div>
    </div>
  `).join('');
}
function renderNotice(){
  document.getElementById('notice-list').innerHTML = notices.map(n => `
    <div class="notice-card" onclick="openNotice(${n.id})">
      <div class="post-mini">${media(n.thumb)}</div>
      <div class="notice-body"><div class="notice-title">${n.title}</div><div class="notice-meta">${n.meta}</div></div>
    </div>
  `).join('');
}
function renderPosts(){
  document.getElementById('talk-list').innerHTML = posts.filter(p=>p.type==='talk').map(p => `
    <div class="list-card" onclick="openPost(${p.id})">
      <div class="post-mini">${media(p.thumb)}</div>
      <div class="list-main"><div class="list-title">${p.title}</div><div class="list-text">${p.body}</div></div>
    </div>
  `).join('');
  document.getElementById('contents-grid').innerHTML = posts.filter(p=>p.type==='content').map(p => `
    <div class="card" onclick="openPost(${p.id})">
      <div class="thumb">${media(p.thumb)}</div>
      <div class="info"><div class="title">${p.title}</div><div class="meta">${p.body}</div></div>
    </div>
  `).join('');
}
window.switchPage = function(page){
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(btn => btn.classList.toggle('active', btn.dataset.page === page));
  window.scrollTo({top:0, behavior:'instant'});
};
window.openPost = function(id){
  const p = posts.find(x => x.id === id);
  editingPostId = id;
  document.getElementById('post-detail').innerHTML = `
    <button class="back" onclick="switchPage('${p.type === 'content' ? 'contents' : 'talk'}')">‹ BACK</button>
    <div class="detail-main">
      <div class="detail-thumb">${media(p.thumb)}</div>
      <div class="detail-title">${p.title}</div>
      <div class="notice-meta" style="margin-bottom:14px">${p.type === 'content' ? 'CONTENTS' : 'ATEEZ TALK'}</div>
      <div class="detail-body">${p.body}</div>
      <div class="actions-bottom">
        <button class="btn btn-light" onclick="editPost(${p.id})">수정</button>
        <button class="btn btn-danger" onclick="deletePost(${p.id})">삭제</button>
      </div>
    </div>
  `;
  switchPage('post-detail');
};
window.editPost = function(id){
  const p = posts.find(x=>x.id===id);
  modalMode='editPost';
  editingPostId=id;
  modalThumb=p.thumb;
  openModal('게시글 수정', p.title, p.body, '');
};
window.deletePost = function(id){
  if(confirm('게시글을 삭제할까요?')){
    const p = posts.find(x=>x.id===id);
    posts = posts.filter(x=>x.id!==id);
    render();
    switchPage(p.type === 'content' ? 'contents' : 'talk');
  }
};
window.openProduct = function(id){
  const p = products.find(x=>x.id===id);
  editingProductId=id;
  document.getElementById('product-detail').innerHTML = `
    <button class="back" onclick="switchPage('shop')">‹ SHOP</button>
    <div class="detail-main">
      <div class="detail-thumb">${media(p.thumb)}</div>
      <div class="detail-title">${p.name}</div>
      <div class="detail-price">${p.price}</div>
      <button class="hero-btn" style="width:100%;margin-bottom:18px" onclick="payProduct(${p.id})">결제하기</button>
      <div class="detail-body">${p.detail}</div>
      <div class="detail-img">${p.detailImg ? `<img src="${p.detailImg}">` : ''}</div>
      <div class="actions-bottom">
        <button class="btn btn-light" onclick="uploadDetailImage(${p.id})">상세사진 첨부</button>
        <button class="btn btn-light" onclick="editProduct(${p.id})">수정</button>
        <button class="btn btn-danger" onclick="deleteProduct(${p.id})">삭제</button>
      </div>
    </div>
  `;
  switchPage('product-detail');
};
window.payProduct = function(id){
  const p = products.find(x=>x.id===id);
  if(p.membership){
    openJoinForm();
    return;
  }
  orders.unshift({
    name:p.name,
    price:p.price,
    date:new Date().toLocaleDateString(),
    status:'결제 완료'
  });
  save();
  alert('결제가 완료되었습니다.');
};
window.openJoinForm = function(){
  modalMode='join';
  modalThumb='';
  openModal('멤버십 가입 정보', '', '', '');
  document.getElementById('modal-title-input').placeholder='이름';
  document.getElementById('modal-body-input').placeholder='생년월일 예: 2006.12.30';
  document.getElementById('modal-price-input').placeholder='전화번호';
  document.getElementById('thumb-area').style.display='none';
  document.getElementById('modal-save').textContent='최종 결제 진행';
};
window.editProduct = function(id){
  const p = products.find(x=>x.id===id);
  modalMode='editProduct';
  editingProductId=id;
  modalThumb=p.thumb;
  openModal('상품 수정', p.name, p.detail, p.price);
};
window.deleteProduct = function(id){
  if(confirm('상품을 삭제할까요?')){
    products = products.filter(p=>p.id!==id);
    render();
    switchPage('shop');

function randomCode(){
  const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  let s='';
  for(let i=0;i<8;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function addYear(d){
  const x = new Date(d);
  x.setFullYear(x.getFullYear()+1);
  return x;
}
function fmt(d){
  return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');
}

function openModal(title,a,b,c){
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-save').textContent = '저장';
  document.getElementById('modal-title-input').style.display='block';
  document.getElementById('modal-body-input').style.display='block';
  document.getElementById('modal-price-input').style.display='block';
  document.getElementById('thumb-area').style.display='block';
  document.getElementById('modal-title-input').placeholder='제목';
  document.getElementById('modal-body-input').placeholder='내용';
  document.getElementById('modal-price-input').placeholder = modalMode==='product'||modalMode==='editProduct' ? '가격' : '메타 정보';
  document.getElementById('modal-title-input').value = a || '';
  document.getElementById('modal-body-input').value = b || '';
  document.getElementById('modal-price-input').value = c || '';
  renderModalThumb();
  document.getElementById('modal').classList.add('open');
}

window.closeModal = function(){
  document.getElementById('modal').classList.remove('open');

window.saveModal = function(){
  const title = document.getElementById('modal-title-input').value.trim();
  const body = document.getElementById('modal-body-input').value.trim();
  const meta = document.getElementById('modal-price-input').value.trim();
  if(modalMode === 'profile'){
    profile.nickname = title;
    render();
    closeModal();
    return;
  }
  if(modalMode === 'join'){
    if(!title || !body || !meta) return alert('이름/생년월일/전화번호를 전부 입력해줘');
    if(!confirm(`최종 결제를 진행할까요?\n\n이름: ${title}\n생년월일: ${body}\n전화번호: ${meta}`)) return;
    const now = new Date();
    const end = addYear(now);
    profile.name = title;
    profile.birth = body;
    profile.phone = meta;
    membership = {
      name:title,
      birth:body,
      phone:meta,
      code:randomCode(),
      start:now.toISOString(),
      end:end.toISOString()
    };
    orders.unshift({
      name:'ATINY MEMBERSHIP (단건 결제)',
      price:'20,000원',
      date:fmt(now),
      status:'결제 완료'
    });
    render();
    closeModal();
    alert('결제가 완료되었습니다. 멤버십 카드가 생성되었습니다.');
    openMembership();
    return;
  }
  if(!title) return alert('제목을 입력해줘');
  if(modalMode === 'notice'){
    notices.unshift({id:Date.now(), title, body:body||'상세 내용입니다.', meta:meta||'KQ엔터테인먼트 · 방금', thumb:modalThumb||'📢'});
    switchPage('notice');
  } else if(modalMode === 'editNotice'){
    const n = notices.find(x=>x.id===editingNoticeId);
    n.title=title; n.body=body; n.meta=meta||n.meta; n.thumb=modalThumb||n.thumb;
    openNotice(n.id);
  } else if(modalMode === 'product'){
    products.unshift({id:Date.now(), thumb:modalThumb||'🛍️', name:title, price:meta||'0원', detail:body||'상품 상세페이지입니다.', detailImg:''});
    switchPage('shop');
  } else if(modalMode === 'editProduct'){
    const p = products.find(x=>x.id===editingProductId);
    p.name=title; p.detail=body; p.price=meta; p.thumb=modalThumb||p.thumb;
    openProduct(p.id);
  } else if(modalMode === 'editPost'){
    const p = posts.find(x=>x.id===editingPostId);
    p.title=title; p.body=body||meta; p.thumb=modalThumb||p.thumb;
    openPost(p.id);
  } else {
    const active = document.querySelector('.view.active').id;
    posts.unshift({id:Date.now(), type:active==='page-contents'?'content':'talk', title, body:body||meta||'새 게시글입니다.', thumb:modalThumb||'＋'});
    switchPage(active==='page-contents'?'contents':'talk');
  }
  render();
  closeModal();
};
async function uploadToCloudinary(){
  return new Promise(resolve=>{
    const input = document.createElement('input');
    input.type='file';
    input.accept='image/*';
    input.onchange = async()=>{
      const file = input.files[0];
      if(!file) return resolve('');
      const fd = new FormData();
      fd.append('file', file);
      fd.append('upload_preset', CLOUDINARY_PRESET);
      try{
        const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`, {
          method:'POST',
          body:fd
        });
        const data = await res.json();
        resolve(data.secure_url || '');
      }catch(e){
        alert('업로드 실패');
        resolve('');
      }
    };
    input.click();
  });
}
