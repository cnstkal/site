<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>TOKTOQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Pretendard,-apple-system,sans-serif;background:#0b0b0b;color:#fff}#app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:92px}.top{padding:22px 20px 10px}.logo{font-size:40px;font-weight:800;letter-spacing:-.08em;text-decoration:underline}.title{font-size:15px;color:#9a9a9a;margin-top:4px}.artistWrap{padding:10px 16px}.artistCard{width:100%;background:#1d1d1f;border:0;border-radius:20px;padding:14px;display:flex;align-items:center;gap:14px;color:#fff;margin-bottom:12px}.artistCard img{width:56px;height:56px;border-radius:16px;object-fit:cover}.artistCard span{font-size:17px;font-weight:600;flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hero{height:330px;position:relative}.hero img{width:100%;height:100%;object-fit:cover}.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.1),rgba(0,0,0,.7))}.heroText{position:absolute;left:24px;right:24px;bottom:34px;z-index:2;text-align:center}.heroText h1{font-size:29px;line-height:1.2;margin-bottom:16px}.join{border:0;background:#fff;color:#111;padding:11px 18px;border-radius:12px;font-size:16px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:18px}.post{background:#fff;border-radius:16px;overflow:hidden}.post img{width:100%;aspect-ratio:1/1;object-fit:cover}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:520px;height:82px;padding-bottom:env(safe-area-inset-bottom);background:rgba(250,250,250,.96);display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid #ddd;backdrop-filter:blur(16px)}.nav button{border:0;background:none;color:#888;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.nav .on{color:#111}.ico{font-size:24px}.adminBtn{position:fixed;right:18px;bottom:100px;width:48px;height:48px;border-radius:50%;border:0;background:#fff;font-size:20px}.panel{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end}.panel.on{display:flex}.sheet{background:#fff;color:#111;width:100%;max-width:520px;margin:auto;border-radius:24px 24px 0 0;padding:18px}.sheet input{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;margin-bottom:10px}.sheet button{width:100%;border:0;background:#111;color:#fff;padding:12px;border-radius:12px;font-weight:700}.back{position:fixed;left:16px;top:16px;z-index:10;border:0;background:none;color:#fff;font-size:32px}.hidden{display:none}
</style>
</head>
<body>
<div id="app"></div>
<button class="adminBtn" onclick="admin.classList.add('on')">⚙</button>
<div class="panel" id="admin"><div class="sheet"><input id="postTitle" placeholder="게시글 제목"><input type="file" id="postFile" accept="image/*"><button onclick="addPost()">게시글 추가</button></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyAA6mbdYfLrrgCJjN47PX91_mU7I53RiBs",authDomain:"site-c67b4.firebaseapp.com",projectId:"site-c67b4",storageBucket:"site-c67b4.firebasestorage.app",messagingSenderId:"744761377245",appId:"1:744761377245:web:3ddaee14f184716eeef634"};
const CLOUDINARY_CLOUD='dbljkloal';
const CLOUDINARY_PRESET='clowofficial';
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
const ref=db.collection('toktoq').doc('mobile');
let state={view:'main',artist:0,nav:['Home','ATEEZ TALK','POP','Contents','Community','Shop'],artists:[{name:'ATEEZ(에이티즈) OFFICIAL PLATFORM',image:'https://images.unsplash.com/photo-1511379938547-c1f69419868d?auto=format&fit=crop&w=900&q=80'},{name:'xikers(싸이커스) OFFICIAL PLATFORM',image:'https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=900&q=80'}],posts:[{title:'Golden Hour',image:'https://images.unsplash.com/photo-1501386761578-eac5c94b800a?auto=format&fit=crop&w=900&q=80'},{title:'Stage',image:'https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?auto=format&fit=crop&w=900&q=80'}]};
async function save(){await ref.set(state)}
ref.onSnapshot(s=>{if(s.exists){state=s.data();render()}})
async function upload(file){const fd=new FormData();fd.append('file',file);fd.append('upload_preset',CLOUDINARY_PRESET);const r=await fetch('https://api.cloudinary.com/v1_1/'+CLOUDINARY_CLOUD+'/image/upload',{method:'POST',body:fd});const j=await r.json();return j.secure_url}
function nav(){return `<div class='nav'><button class='on'><div class='ico'>⌂</div>${state.nav[0]}</button><button><div class='ico'>▤</div>${state.nav[1]}</button><button><div class='ico'>POP</div>${state.nav[2]}</button><button><div class='ico'>▶</div>${state.nav[3]}</button><button><div class='ico'>●●</div>${state.nav[4]}</button><button><div class='ico'>▢</div>${state.nav[5]}</button></div>`}
function render(){if(state.view==='artist'){const a=state.artists[state.artist];app.innerHTML=`<button class='back' onclick='goMain()'>‹</button><section class='hero'><img src='${a.image}'><div class='heroText'><h1>${a.name}</h1><button class='join'>멤버십 가입</button></div></section><div class='grid'>${state.posts.map(p=>`<div class='post'><img src='${p.image}'></div>`).join('')}</div>${nav()}`;return;}app.innerHTML=`<div class='top'><div class='logo'>TOKTOQ</div><div class='title'>ARTIST PLATFORM</div></div><div class='artistWrap'>${state.artists.map((a,i)=>`<button class='artistCard' onclick='openArtist(${i})'><img src='${a.image}'><span>${a.name}</span><div>›</div></button>`).join('')}</div>${nav()}`}
function openArtist(i){state.view='artist';state.artist=i;render();scrollTo(0,0)}
function goMain(){state.view='main';render();scrollTo(0,0)}
async function addPost(){const title=postTitle.value||'NEW';let image='https://images.unsplash.com/photo-1501386761578-eac5c94b800a?auto=format&fit=crop&w=900&q=80';if(postFile.files[0]) image=await upload(postFile.files[0]);state.posts.unshift({title,image});await save();admin.classList.remove('on');postTitle.value='';postFile.value='';}
admin.onclick=e=>{if(e.target===admin)admin.classList.remove('on')}
render();
</script>
</body>
</html>
