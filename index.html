<!DOCTYPE html>
<html lang="ko">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>TOKTOQ Style Mobile Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--txt:#111;--sub:#777;--line:#ececec;--soft:#f5f6f8;--card:#fff;--dark:#151515;--accent:#111;--red:#ff4646;--gold:#f5a600;--blue:#0a3164;--nav:74px;--top:82px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;letter-spacing:-.04em;overflow-x:hidden}button,input,textarea,select{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer}img{display:block;width:100%;height:100%;object-fit:cover}.app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom));background:#fff}.topbar{position:sticky;top:0;z-index:30;height:var(--top);padding:18px 20px 12px;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);display:flex;align-items:end;gap:22px}.brand{font-size:18px;font-weight:900;font-style:italic;letter-spacing:-.08em;min-width:118px}.hamb{font-size:30px;line-height:1}.top-icons{margin-left:auto;display:flex;gap:18px;align-items:center;font-size:29px}.profile-dot{width:42px;height:42px;border-radius:50%;background:#abb5ff;color:#fff;display:grid;place-items:center;font-size:25px}.screen{display:none}.screen.on{display:block}.pad{padding:0 20px}.section{padding:28px 20px;border-top:1px solid var(--line)}.section:first-child{border-top:0}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.section h2{font-size:27px;margin:0;font-weight:900;letter-spacing:-.06em}.more{color:#777;font-weight:600;font-size:18px}.h-scroll{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin:0 -20px;padding-left:20px}.h-scroll::-webkit-scrollbar{display:none}.artist-card{min-width:calc(100% - 40px);background:#2a2a2a;color:white;border-radius:20px;padding:14px;display:flex;align-items:center;gap:16px;scroll-snap-align:start}.artist-card .logo{width:66px;height:66px;border-radius:10px;background:#ddd;overflow:hidden;flex:none}.artist-card strong{font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.arrow{margin-left:auto;color:#777;font-size:36px}.dark-home{background:#151515;color:white;min-height:100vh}.dark-home .topbar{background:#151515;color:white}.toktoq-logo{font-size:42px;font-weight:900;text-decoration:underline;margin:22px 20px 34px;letter-spacing:-.07em}.feature-title{padding:0 20px;margin-top:26px;font-size:28px;font-weight:900}.wide-card{min-width:78%;border-radius:18px;overflow:hidden;background:#242424;color:#fff;scroll-snap-align:start}.wide-card .thumb{height:180px;background:#333}.wide-card .txt{padding:18px}.wide-card b{font-size:24px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wide-card p{margin:12px 0 0;color:#aaa;font-size:18px}.hero{position:relative;height:555px;background:#ddd;overflow:hidden}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(255,255,255,.04) 0%,rgba(255,255,255,.1) 38%,rgba(24,25,39,.75) 100%)}.hero .hero-img{position:absolute;inset:0}.hero-content{position:absolute;z-index:2;left:0;right:0;bottom:58px;text-align:center;color:white;padding:0 24px}.hero-logo{width:250px;margin:0 auto 18px;filter:drop-shadow(0 3px 12px rgba(0,0,0,.25))}.socials{display:flex;justify-content:center;gap:20px;font-size:34px;margin:12px 0 24px;opacity:.95}.join{background:#fff;color:#111;border-radius:10px;padding:17px 28px;font-size:24px;font-weight:800}.story-row{display:flex;gap:18px;overflow-x:auto;padding:22px 20px}.story{min-width:150px}.story .pic{height:150px;border-radius:12px;overflow:hidden;background:#eee}.story span{display:block;text-align:center;margin-top:-38px;color:white;font-size:20px;text-shadow:0 2px 8px #000}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.tile{border-radius:7px;overflow:hidden;border:1px solid #ddd;background:#fff}.tile .img{aspect-ratio:1/1;background:#eee}.tile .body{padding:14px}.tile b{font-size:20px}.tile p{margin:10px 0;color:#555;font-size:16px}.banner{height:120px;background:#0b2b53;color:#f8d074;display:grid;place-items:center;text-align:center;font-size:30px;font-weight:900}.content-hero{background:#050505;color:white;text-align:center;padding-top:0}.big-video{height:360px;background:#111;position:relative}.big-video:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 38%,#000 100%)}.content-hero h1{font-size:32px;line-height:1.2;padding:22px;margin:0}.mini-row{display:flex;gap:14px;overflow:auto;padding:18px 20px 28px}.mini-row div{min-width:120px;height:70px;border-radius:6px;overflow:hidden;border:2px solid #fff}.chips{display:flex;gap:12px;overflow:auto;padding:22px 20px;border-bottom:1px solid var(--line)}.chip{padding:13px 24px;border:1px solid #ddd;border-radius:999px;background:#fff;color:#555;font-size:18px;white-space:nowrap}.card-post{margin:0 20px 22px;border-radius:18px;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.08);overflow:hidden}.card-post .post-img{height:230px;background:#eee}.post-body{padding:20px}.post-body h3{font-size:25px;line-height:1.25;margin:0 0 12px}.meta{color:#777;font-size:16px;margin-bottom:12px}.reactions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.react{background:#f0f0f0;border:1px solid #ddd;border-radius:999px;padding:8px 14px;font-size:18px}.talk-head{display:flex;gap:18px;overflow:auto;padding:20px;border-bottom:1px solid var(--line)}.member{min-width:72px;text-align:center}.member .avatar{width:72px;height:72px;border-radius:50%;overflow:hidden;background:#eee}.member span{display:block;margin-top:8px;font-size:16px;font-weight:700;color:#555}.feed-post{padding:26px 20px;border-bottom:1px solid var(--line)}.feed-author{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:900;margin-bottom:20px}.feed-author .avatar{width:48px;height:48px;border-radius:50%;overflow:hidden}.verify{color:#0a3164;font-size:20px}.feed-media{border-radius:18px;overflow:hidden;background:#111;height:450px}.feed-title{font-size:28px;margin:24px 0 10px}.pop-list{margin:28px 20px;background:#f5f6f8;border-radius:24px;padding:20px}.pop-item{display:flex;align-items:center;gap:16px;padding:14px 0}.pop-item .avatar{width:56px;height:56px;border-radius:50%;overflow:hidden;background:#ddd}.pop-item b{font-size:24px}.pop-item p{margin:3px 0 0;color:#555;font-size:18px}.red-dot{margin-left:auto;width:12px;height:12px;background:#ff4b4b;border-radius:50%}.tabs{position:sticky;top:var(--top);z-index:20;background:#fff;display:flex;gap:28px;overflow:auto;padding:20px;border-bottom:1px solid var(--line)}.tab{font-size:24px;font-weight:900;color:#999;white-space:nowrap;padding-bottom:12px}.tab.active{color:#111;border-bottom:3px solid #111}.notice{padding:24px 20px;border-bottom:1px solid var(--line)}.notice h3{font-size:22px;margin:0 0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.notice p{font-size:17px;color:#777;margin:0}.shop-banner{height:240px;background:#082b47;display:grid;place-items:center;color:#edc56c;text-align:center;font-size:34px;font-weight:900}.shop-item .img{border-radius:10px;overflow:hidden;aspect-ratio:1/1;background:#eee}.shop-item .only{color:var(--gold);font-size:17px;font-weight:900;margin-top:14px}.shop-item h3{font-size:22px;margin:6px 0}.price{font-size:25px;font-weight:900}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:40;width:100%;max-width:520px;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(6,1fr);background:rgba(255,255,255,.94);border-top:1px solid #eee;backdrop-filter:blur(16px)}.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#777;font-weight:700;font-size:13px}.nav button.active{color:#111}.nav i{font-style:normal;font-size:25px}.float-top{position:fixed;right:18px;bottom:100px;z-index:35;width:58px;height:58px;border-radius:50%;background:#fff;box-shadow:0 5px 20px rgba(0,0,0,.18);font-size:32px}.admin-fab{position:fixed;right:18px;bottom:170px;z-index:50;width:58px;height:58px;border-radius:50%;background:#111;color:#fff;font-size:25px;box-shadow:0 8px 20px rgba(0,0,0,.25)}.admin{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.45);display:none}.admin.on{display:block}.admin-panel{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:auto;background:#fff;border-radius:26px 26px 0 0;max-height:88vh;overflow:auto;padding:20px}.admin-panel h2{margin:8px 0 14px;font-size:26px}.admin-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.admin-grid button,.save{background:#111;color:white;border-radius:12px;padding:13px;font-weight:800}.danger{background:#ff4747!important}.form{display:grid;gap:10px;margin-top:14px}.form input,.form textarea,.form select{width:100%;border:1px solid #ddd;border-radius:12px;padding:12px;background:#fafafa}.list-edit{margin-top:14px;display:grid;gap:10px}.edit-row{border:1px solid #ddd;border-radius:14px;padding:12px}.edit-row b{display:block;margin-bottom:8px}.edit-row .rowbtn{display:flex;gap:8px}.rowbtn button{flex:1;background:#eee;border-radius:10px;padding:9px}.empty{padding:40px 20px;color:#777;text-align:center}@media(min-width:700px){body{background:#eee}.app{box-shadow:0 0 0 1px #ddd}.admin-panel{left:50%;transform:translateX(-50%)}}</style>
</head>
<body>
<div class="app" id="app"></div>
<button class="admin-fab" onclick="openAdmin()">⚙</button><button class="float-top" onclick="scrollTo({top:0,behavior:'smooth'})">↑</button>
<div class="admin" id="admin"><div class="admin-panel"><button style="float:right;font-size:28px" onclick="closeAdmin()">×</button><h2>사이트 수정 관리</h2><div class="admin-grid"><button onclick="adminForm('site')">기본/히어로</button><button onclick="adminForm('artists')">아티스트</button><button onclick="adminForm('contents')">콘텐츠</button><button onclick="adminForm('talk')">ATEEZ TALK</button><button onclick="adminForm('pop')">POP 채팅</button><button onclick="adminForm('community')">커뮤니티</button><button onclick="adminForm('shop')">샵 상품</button><button class="danger" onclick="resetAll()">전체 초기화</button></div><div id="adminArea"></div></div></div>
<script>
const ph=['https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1000&q=80','https://images.unsplash.com/photo-1511379938547-c1f69419868d?auto=format&fit=crop&w=1000&q=80','https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=1000&q=80','https://images.unsplash.com/photo-1521334884684-d80222895322?auto=format&fit=crop&w=1000&q=80','https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=1000&q=80'];
const defaults={site:{brand:'ATEEZ',darkLogo:'TOKTOQ',heroTitle:'My GHOSTEEZ BESTIES',heroImg:ph[0],membership:'멤버십 가입'},artists:[{name:'ATEEZ(에이티즈) OFFICIAL PLATFORM',img:ph[1]},{name:'xikers(싸이커스) OFFICIAL PLATFORM',img:ph[2]}],contents:[{cat:'[GOLDEN HOUR]',title:'Adrenaline MAX ⚡ 보이스 비하인드 ✌🏻',img:ph[3],type:'video',comment:'다시봐도 뭔가 방전되기전 각...'},{cat:'VIDEO',title:"ATEEZ(에이티즈) 민기 'Dinero' Production Behind",img:ph[4],type:'youtube',comment:'mingi you are the moment 😭'},{cat:'ATINY ZONE',title:'OUR ETERNAL STARS',img:ph[0],type:'post',comment:'membership only'}],talk:[{name:'홍중',avatar:ph[0],title:'우리 티니들 간바떼!💪',img:ph[1],body:'3주 전 · 🙂 18,836 · 💬 1,384'},{name:'띵화',avatar:ph[2],title:'[👻] MY BESTIES',img:ph[3],body:'오늘의 사진'},{name:'윤호',avatar:ph[4],title:'라이브 종료됨',img:ph[0],body:'4달 전'}],pop:[{name:'윤호',avatar:ph[4],msg:'라이브 종료됨 · 4달 전'},{name:'홍중',avatar:ph[0],msg:'라이브 종료됨 · 2년 전'},{name:'여상',avatar:ph[1],msg:'라이브 종료됨 · 2년 전'},{name:'쫑호',avatar:ph[2],msg:'라이브 종료됨 · 2년 전'}],community:[{title:'ATEEZ(에이티즈) 편지 전달 주소 안내 [48]',body:'KQ엔터테인먼트 · 매니저 · 3년 전 · 반응 239'},{title:'ATEEZ(에이티즈) 오피셜 플랫폼 오픈 안내 [173]',body:'KQ엔터테인먼트 · 매니저 · 3년 전'},{title:'2024 ATEEZ WORLD TOUR 안내 [1320]',body:'tiktok.com/@enh.yp Anthony cambodiaHi'}],shop:[{name:'ATINY 7th MEMBERSHIP KIT',price:'15,000원',img:ph[3],only:'멤버십 전용'},{name:'ATINY 7TH KIT VOD ONLY',price:'7,000원',img:ph[4],only:''},{name:'PHOTO CARD SET',price:'12,000원',img:ph[1],only:''}]};
let data=JSON.parse(localStorage.getItem('toktoqData')||'null')||defaults;let page=localStorage.getItem('toktoqPage')||'home';const $=s=>document.querySelector(s);function save(){localStorage.setItem('toktoqData',JSON.stringify(data));render()}function nav(){return `<div class="nav">${[['home','⌂','Home'],['talk','▤','ATEEZ TALK'],['pop','POP','POP'],['contents','▶','Contents'],['community','●●','Community'],['shop','◡','Shop']].map(n=>`<button class="${page==n[0]?'active':''}" onclick="go('${n[0]}')"><i>${n[1]}</i><span>${n[2]}</span></button>`).join('')}</div>`}function topbar(){return `<div class="topbar"><button class="hamb">≡</button><div class="brand">${data.site.brand}</div><div class="top-icons"><span>♧</span><span>□</span><span>♧</span><span class="profile-dot">◕</span></div></div>`}function go(p){page=p;localStorage.setItem('toktoqPage',p);render();scrollTo(0,0)}function render(){let html= page=='home'?home():page=='talk'?talk():page=='pop'?pop():page=='contents'?contents():page=='community'?community():shop();$('#app').innerHTML=html+nav()}function home(){return `${topbar()}<section class="hero"><div class="hero-img"><img src="${data.site.heroImg}"></div><div class="hero-content"><h1>${data.site.heroTitle}</h1><div class="socials"><span>▶</span><span>𝕏</span><span>◎</span><span>f</span></div><button class="join">${data.site.membership}</button></div></section><div class="story-row">${data.talk.map(x=>`<div class="story"><div class="pic"><img src="${x.img}"></div><span>${x.name}</span></div>`).join('')}</div><section class="section"><h2>X ${data.site.brand} Official</h2><div class="grid2">${data.contents.slice(0,2).map(card).join('')}</div></section><div class="banner">OUR ETERNAL STAR ATINY</div><section class="section"><h2>NEW CONTENT</h2>${data.contents.map(postCard).join('')}</section>`}function talk(){return `${topbar()}<div class="talk-head">${data.talk.map(x=>`<div class="member"><div class="avatar"><img src="${x.avatar}"></div><span>${x.name}</span></div>`).join('')}</div>${data.talk.map(x=>`<article class="feed-post"><div class="feed-author"><div class="avatar"><img src="${x.avatar}"></div>${x.name}<span class="verify">●</span><span style="margin-left:auto">⋮</span></div><div class="feed-media"><img src="${x.img}"></div><h2 class="feed-title">${x.title}</h2><p class="meta">${x.body}</p></article>`).join('')}` }function pop(){return `${topbar()}<div class="pad"><h1 style="font-size:42px;margin:55px 0">윤사님</h1><h2 style="color:#777">채팅</h2></div><div class="pop-list">${data.pop.map(x=>`<div class="pop-item"><div class="avatar"><img src="${x.avatar}"></div><div><b>${x.name} <span class="verify">●</span></b><p>${x.msg}</p></div><span class="red-dot"></span></div>`).join('')}</div>`}function contents(){return `${topbar()}<section class="content-hero"><div class="big-video"><img src="${data.contents[1]?.img||ph[0]}"></div><p style="color:#aaa;font-size:20px;margin:18px 0 0">NEW CONTENT ›</p><h1>${data.contents[1]?.title||'NEW CONTENT'}</h1><div class="mini-row">${data.contents.map(x=>`<div><img src="${x.img}"></div>`).join('')}</div></section><div class="chips"><span class="chip">🏷</span><span class="chip">NOTICE</span><span class="chip">EVENT</span><span class="chip">공방공지</span><span class="chip">서베이</span></div>${groupedContents()}` }function groupedContents(){let cats=[...new Set(data.contents.map(x=>x.cat))];return cats.map(c=>`<section class="section"><div class="section-head"><h2>${c}</h2><span class="more">전체보기</span></div><div class="grid2">${data.contents.filter(x=>x.cat==c).map(card).join('')}</div></section>`).join('')}function community(){return `${topbar()}<div class="tabs"><span class="tab active">NOTICE</span><span class="tab">FREE TALK<span style="color:red">•</span></span><span class="tab">EVENT</span><span class="tab">📋⌄</span></div><section class="notice"><h2>📌 고정된 포스트 <span style="float:right;font-size:20px">접기</span></h2></section>${data.community.map(x=>`<article class="notice"><h3>${x.title}</h3><p>${x.body}</p></article>`).join('')}` }function shop(){return `${topbar()}<div class="shop-banner">OUR ETERNAL STAR ATINY</div><div class="tabs"><span class="tab active">ALL</span><span class="tab">MEMBERSHIP</span><span class="tab">ALBUM</span><span class="tab">PRODUCT</span></div><section class="section"><div class="grid2">${data.shop.map(x=>`<div class="shop-item"><div class="img"><img src="${x.img}"></div><div class="only">${x.only}</div><h3>${x.name}</h3><div class="price">${x.price}</div></div>`).join('')}</div></section>`}function card(x){return `<div class="tile"><div class="img"><img src="${x.img}"></div><div class="body"><b>${x.title}</b><p>${x.comment}</p></div></div>`}function postCard(x){return `<article class="card-post"><div class="post-img"><img src="${x.img}"></div><div class="post-body"><h3>${x.title}</h3><div class="meta">55분 전 · 🙂 1,231 · 💬 41</div><p>${x.comment}</p><div class="reactions"><span class="react">👍 123</span><span class="react">💗 719</span><span class="react">🍿 58</span><span class="react">✅ 45</span></div></div></article>`}
function openAdmin(){admin.classList.add('on');adminForm('site')}function closeAdmin(){admin.classList.remove('on')}function adminForm(type){const a=$('#adminArea');if(type=='site'){a.innerHTML=`<div class="form"><input id="brand" value="${data.site.brand}" placeholder="상단 로고명"><input id="heroTitle" value="${data.site.heroTitle}" placeholder="히어로 문구"><input id="heroImg" value="${data.site.heroImg}" placeholder="히어로 이미지 URL"><input id="membership" value="${data.site.membership}" placeholder="버튼 문구"><button class="save" onclick="data.site={brand:brand.value,darkLogo:'TOKTOQ',heroTitle:heroTitle.value,heroImg:heroImg.value,membership:membership.value};save()">저장</button></div>`;return}let fields={artists:['name','img'],contents:['cat','title','img','comment','type'],talk:['name','avatar','title','img','body'],pop:['name','avatar','msg'],community:['title','body'],shop:['name','price','img','only']}[type];a.innerHTML=`<div class="form">${fields.map(f=>`<input id="f_${f}" placeholder="${f}">`).join('')}<button class="save" onclick="addItem('${type}')">추가</button></div><div class="list-edit">${data[type].map((x,i)=>`<div class="edit-row"><b>${x.title||x.name}</b><div class="rowbtn"><button onclick="editItem('${type}',${i})">수정</button><button onclick="delItem('${type}',${i})">삭제</button></div></div>`).join('')}</div>`}function addItem(type){let obj={};document.querySelectorAll('#adminArea [id^=f_]').forEach(i=>obj[i.id.slice(2)]=i.value);data[type].unshift(obj);save();adminForm(type)}function delItem(t,i){if(confirm('삭제할까요?')){data[t].splice(i,1);save();adminForm(t)}}function editItem(t,i){let x=data[t][i];let keys=Object.keys(x);$('#adminArea').innerHTML=`<div class="form">${keys.map(k=>`<input id="e_${k}" value="${String(x[k]).replaceAll('"','&quot;')}" placeholder="${k}">`).join('')}<button class="save" onclick="saveEdit('${t}',${i})">수정 저장</button></div>`}function saveEdit(t,i){document.querySelectorAll('#adminArea [id^=e_]').forEach(inp=>data[t][i][inp.id.slice(2)]=inp.value);save();adminForm(t)}function resetAll(){if(confirm('저장된 수정사항을 전부 초기화할까요?')){localStorage.removeItem('toktoqData');data=structuredClone(defaults);render();adminForm('site')}}render();
</script>
</body>
</html>
