<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATEEZ Official Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--card:#f5f5f7;--line:#e5e5e5;--sub:#777;--danger:#e63946;--blue:#7f91b5}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:Pretendard,sans-serif;background:#fff;color:#111}.app{padding-bottom:92px}
header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:1.2rem;font-weight:800}.header-actions{display:flex;gap:16px;align-items:center}.header-actions button{border:0;background:none;font-size:1.28rem;position:relative}.alert-dot{position:absolute;right:-2px;top:-2px;width:8px;height:8px;background:#e63946;border-radius:50%;display:none}.alert-dot.on{display:block}
.profile-mini{width:30px;height:30px;border-radius:50%;background:#e9e9ef;overflow:hidden;display:grid;place-items:center}.profile-mini img{width:100%;height:100%;object-fit:cover}
.view{display:none}.view.active{display:block}.hero{padding:20px}.hero-card{background:linear-gradient(135deg,#fff,#f2f2f2);border:1px solid var(--line);border-radius:28px;padding:28px 22px;min-height:220px;display:flex;flex-direction:column;justify-content:flex-end}.hero-card h1{font-size:2.2rem;line-height:1;letter-spacing:-.05em;margin-bottom:10px}.hero-card p{font-size:.92rem;color:var(--sub);margin-bottom:18px}.hero-btn,.btn-dark{height:48px;border:0;border-radius:999px;background:#111;color:#fff;font-weight:800;padding:0 18px}
.section{padding:0 20px 28px}.pad-top{padding-top:20px}.section-title{font-size:1rem;font-weight:800;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card,.list-card,.notice-card,.my-row,.cart-row,.order-row,.alarm-row,.detail-main{background:var(--card);border:1px solid #ececec;border-radius:20px}.card{overflow:hidden;cursor:pointer}.thumb{aspect-ratio:1/1;background:#e8e8ec;display:flex;align-items:center;justify-content:center;font-size:2rem;overflow:hidden}.thumb img,.detail-thumb img,.detail-img img,.post-mini img,.cart-thumb img,.order-thumb img,.feed-avatar img,.m-photo img{width:100%;height:100%;object-fit:cover}.info{padding:12px}.title{font-size:.9rem;font-weight:800;line-height:1.35;margin-bottom:4px}.meta{font-size:.75rem;color:var(--sub)}
.list{padding:0 20px 28px;display:flex;flex-direction:column;gap:14px}.list-card,.notice-card,.cart-row,.order-row,.alarm-row{padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer}.notice-card{margin-bottom:14px}.post-mini,.cart-thumb,.order-thumb{width:54px;height:54px;border-radius:16px;background:#e8e8ec;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}.list-main,.notice-body,.cart-main,.order-main,.alarm-main{flex:1;min-width:0}.list-title,.notice-title,.cart-title,.order-title,.alarm-title{font-size:.92rem;font-weight:800;line-height:1.3}.list-text,.cart-meta,.order-meta,.alarm-meta{font-size:.82rem;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.notice-meta{font-size:.74rem;color:var(--sub)}
.my-menu{padding:0 20px 28px}.my-row{padding:17px 16px;margin-bottom:10px;font-size:.92rem;font-weight:800;display:flex;justify-content:space-between;cursor:pointer}.logout{color:var(--danger)}
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;height:74px;background:rgba(255,255,255,.95);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;z-index:200}.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.62rem;color:var(--sub);font-weight:600;border:0;background:none;font-family:inherit}.nav-item.active{color:#111}.upload-btn{position:fixed;right:20px;bottom:96px;width:58px;height:58px;border-radius:50%;border:0;background:#111;color:#fff;font-size:1.8rem;box-shadow:0 10px 30px rgba(0,0,0,.15);z-index:150}
.detail-wrap{padding:20px}.back{border:0;background:none;font-size:.85rem;font-weight:800;margin-bottom:14px;color:#555}.detail-main{padding:18px}.detail-thumb{width:100%;aspect-ratio:1;border-radius:20px;background:#e8e8ec;display:flex;align-items:center;justify-content:center;font-size:3rem;overflow:hidden;margin-bottom:16px}.detail-title{font-size:1.28rem;font-weight:900;margin-bottom:8px}.detail-price{font-size:1.1rem;font-weight:900;margin-bottom:14px}.detail-body{font-size:.92rem;line-height:1.65;color:#444;white-space:pre-line}.detail-img{width:100%;border-radius:18px;overflow:hidden;background:#eee;margin-top:14px}.detail-img:empty{display:none}.actions-bottom{padding-top:18px;display:flex;gap:10px;flex-wrap:wrap}.btn{height:46px;border-radius:999px;border:0;font-weight:800;padding:0 18px;font-family:inherit}.btn-light{background:#fff;border:1px solid var(--line);color:#111}.btn-danger{background:var(--danger);color:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:300;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{width:100%;background:#fff;border-radius:24px 24px 0 0;padding:20px;max-height:86vh;overflow:auto}.sheet-title{font-weight:900;margin-bottom:14px}.input,.textarea{width:100%;border:1px solid var(--line);border-radius:16px;background:#fff;padding:14px;font-family:inherit;font-size:.9rem;margin-bottom:10px}.textarea{min-height:120px;resize:vertical}.thumb-preview{height:92px;border-radius:18px;background:#f1f1f1;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:10px;color:#888;font-size:.85rem}.thumb-preview img{width:100%;height:100%;object-fit:cover}
.member-head{display:flex;align-items:center;gap:10px;padding:24px 20px 8px}.member-head h1{font-size:2rem;font-weight:900}.pill{background:#eee;border-radius:999px;padding:6px 10px;font-size:.8rem;font-weight:800}.member-wrap{padding:34px 20px;text-align:center}.flip{perspective:1200px}.membership-card{width:78%;max-width:330px;aspect-ratio:.72/1;margin:0 auto 28px;position:relative;transform-style:preserve-3d;transition:.5s}.membership-card.flipped{transform:rotateY(180deg)}.card-face{position:absolute;inset:0;border-radius:28px;backface-visibility:hidden;box-shadow:0 22px 42px rgba(0,0,0,.08);overflow:hidden}.card-front{background:linear-gradient(135deg,#fff,#eef2f9,#fff);display:flex;align-items:center;justify-content:center;color:#aaa;font-weight:900;font-size:1.25rem;padding:24px}.card-back{background:#f2f1fa;transform:rotateY(180deg);display:flex;text-align:left}.card-back:before{content:'';width:28%;background:rgba(0,0,0,.04);border-right:1px solid rgba(0,0,0,.06)}.card-back-inner{padding:28px 22px;flex:1}.small-label{font-size:.82rem;margin-top:18px}.big-info{font-size:1.35rem;font-weight:900;margin-top:5px;word-break:break-all}.blue-btn{width:100%;height:64px;border-radius:14px;background:var(--blue);color:#fff;border:0;font-weight:900;font-size:1.18rem}.qty{display:flex;gap:8px;align-items:center;margin-top:8px}.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:900}

/* TALK FEED ONLY */
.member-strip{display:flex;gap:18px;overflow-x:auto;padding:18px 20px 16px;border-bottom:1px solid var(--line);scrollbar-width:none}
.member-strip::-webkit-scrollbar{display:none}
.member-chip{border:0;background:none;min-width:72px;text-align:center;font-family:inherit;color:#777}
.member-chip .m-photo{width:66px;height:66px;border-radius:50%;background:#e8e8ec;display:flex;align-items:center;justify-content:center;font-size:1.7rem;overflow:hidden;margin:0 auto 8px;border:2px solid transparent}
.member-chip.active .m-photo{border-color:#111}
.member-chip .m-name{font-size:.82rem;font-weight:800;white-space:nowrap}
.talk-feed{padding:22px 20px 120px}
.feed-card{padding:20px 0;border-bottom:1px solid var(--line)}
.feed-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.feed-user{display:flex;align-items:center;gap:10px}
.feed-avatar{width:44px;height:44px;border-radius:50%;background:#e8e8ec;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:1.3rem}
.feed-name{font-weight:900;font-size:1.05rem}
.verified{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#0b3b77;color:#fff;font-size:.72rem;margin-left:4px}
.feed-more{border:0;background:none;font-size:1.5rem;color:#777}
.feed-media{width:100%;border-radius:18px;background:#111;overflow:hidden;margin-bottom:18px;display:flex;align-items:center;justify-content:center;min-height:240px}
.feed-media img{width:100%;display:block;object-fit:cover}
.feed-media .emoji-media{font-size:4rem;padding:70px 0}
.feed-title{font-size:1.35rem;font-weight:600;line-height:1.35;margin-bottom:14px}
.feed-meta{font-size:.92rem;color:#777;margin-bottom:14px}
.feed-comment{font-size:.98rem;line-height:1.45;margin-bottom:16px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reaction-row{display:flex;gap:10px;flex-wrap:wrap}
.react-btn{height:38px;border-radius:999px;border:1px solid var(--line);background:#f8f8f8;padding:0 14px;font-weight:800;color:#333}



/* TALK DETAIL PAGE */
.talk-detail-wrap{padding:20px 20px 130px}
.talk-detail-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.talk-detail-user{display:flex;align-items:center;gap:10px}
.talk-detail-avatar{width:48px;height:48px;border-radius:50%;background:#e8e8ec;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:1.5rem}
.talk-detail-avatar img{width:100%;height:100%;object-fit:cover}
.talk-detail-name{font-size:1.15rem;font-weight:900}
.talk-detail-time{font-size:.85rem;color:#999;margin-top:3px}
.talk-detail-more{border:0;background:none;font-size:1.6rem;color:#777}
.talk-detail-media{width:100%;border-radius:18px;background:#111;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:280px;margin-bottom:22px}
.talk-detail-media img{width:100%;display:block;object-fit:cover}
.talk-detail-media .emoji-media{font-size:4rem;padding:90px 0}
.talk-detail-title{font-size:1.55rem;line-height:1.35;margin-bottom:18px;font-weight:600}
.talk-detail-reactions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 24px}
.talk-detail-bottom{position:fixed;left:0;right:0;bottom:74px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:14px 20px;display:flex;gap:28px;align-items:center;font-weight:900;z-index:160}
.comment-section{background:#f7f7f7;margin:0 -20px -130px;padding:26px 20px 150px}
.comment-title{font-size:1.35rem;font-weight:900;margin-bottom:18px}
.comment-input{height:62px;background:#e9e9e9;border-radius:14px;display:flex;align-items:center;gap:12px;padding:0 18px;font-size:1.15rem;color:#555;margin-bottom:26px}
.comment-row{display:flex;gap:12px;margin-bottom:28px}
.comment-avatar{width:34px;height:34px;border-radius:50%;background:#d9ddff;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.comment-body{flex:1}
.comment-meta{font-size:.95rem;color:#888;margin-bottom:8px}
.comment-text{font-size:1.08rem;line-height:1.55;color:#444}
.comment-more{border:0;background:none;font-size:1.3rem;color:#777}
@media(min-width:900px){.talk-detail-bottom{left:50%;right:auto;transform:translateX(-50%);max-width:500px;width:500px}}




.shop-detail-wrap{padding-bottom:140px}
.shop-hero{width:100%;aspect-ratio:1/1;background:#f5f5f7;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.shop-hero img{width:100%;height:100%;object-fit:cover}
.shop-page-info{padding:24px 20px}
.shop-page-title{font-size:2rem;font-weight:900;line-height:1.2}
.shop-page-price{font-size:3rem;font-weight:900;margin-top:18px}
.shop-shipping{margin-top:28px;border-top:1px solid var(--line);padding-top:22px}
.shop-shipping-row{display:flex;justify-content:space-between;align-items:center;font-size:1.1rem;font-weight:800}
.shop-shipping-sub{font-size:1rem;color:#999;margin-top:18px}
.shop-desc{margin-top:34px;padding-top:34px;border-top:12px solid #f5f5f7}
.shop-desc h3{font-size:2rem;font-weight:900;margin-bottom:26px}
.shop-desc-body{font-size:1.35rem;line-height:1.8;white-space:pre-line}
.shop-bottom-bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:14px 16px calc(14px + env(safe-area-inset-bottom));display:flex;gap:12px;z-index:300}
.shop-cart-btn,.shop-buy-btn{height:62px;border-radius:18px;font-size:1.3rem;font-weight:900;font-family:inherit}
.shop-cart-btn{flex:1;background:#fff;border:2px solid #111}
.shop-buy-btn{flex:1;background:#7d8fb7;color:#fff;border:0}

/* REQUEST FIXES */
.post-menu{position:absolute;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 28px rgba(0,0,0,.12);padding:8px;z-index:500;display:none;min-width:120px}
.post-menu.open{display:block}
.post-menu button{display:block;width:100%;height:38px;border:0;background:#fff;text-align:left;padding:0 12px;font-weight:800;border-radius:10px}
.post-menu button.danger{color:var(--danger)}
.feed-card{position:relative}
.comment-row{position:relative}
.content-add-btn{height:42px;border-radius:999px;border:0;background:#111;color:#fff;font-weight:900;padding:0 16px}
.content-toolbar{padding:16px 20px 0;display:flex;justify-content:flex-end}
.shop-tabs{display:flex;gap:20px;overflow-x:auto;padding:0 20px 18px;border-bottom:1px solid var(--line);scrollbar-width:none}
.shop-tabs::-webkit-scrollbar{display:none}
.shop-tab{border:0;background:none;font-family:inherit;font-size:1.15rem;font-weight:900;color:#888;padding:12px 0;white-space:nowrap;border-bottom:3px solid transparent}
.shop-tab.active{color:#111;border-bottom-color:#111}
.shop-more-sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:420}
.shop-more-sheet.open{display:flex}
.shop-more-panel{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:26px 24px 60px}
.shop-more-panel button{display:block;width:100%;height:56px;border:0;background:#fff;text-align:left;font-size:1.25rem;font-weight:800;color:#777}
.shop-more-panel button.active{color:#111}
.shop-more-close{position:absolute;right:22px;top:18px;font-size:2rem!important;text-align:right!important}
@media(min-width:900px){.shop-more-sheet{left:50%;transform:translateX(-50%);max-width:500px}}

/* BOARD CATEGORY PAGES */
.board-head{padding:24px 20px 14px}
.board-head h1{font-size:2.3rem;font-weight:900;letter-spacing:-.06em}
.board-tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);margin:20px 0 24px}
.board-tabs button{height:58px;border:0;background:none;font-size:1.15rem;font-weight:900;color:#999;font-family:inherit;border-bottom:3px solid transparent}
.board-tabs button.active{color:#111;border-bottom-color:#111}
.board-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:28px 16px;padding:0 20px 120px}
.board-thumb{width:100%;aspect-ratio:16/9;border-radius:10px;background:#e8e8ec;display:flex;align-items:center;justify-content:center;font-size:2.4rem;overflow:hidden}
.board-thumb img{width:100%;height:100%;object-fit:cover}
.board-title{font-size:1.05rem;line-height:1.35;font-weight:600;margin-top:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.board-time{font-size:.92rem;color:#777;margin-top:8px}
.blog-detail{padding:20px 20px 130px}
.blog-title{font-size:2rem;line-height:1.2;font-weight:900;margin:18px 0 14px}
.blog-date{font-size:1rem;color:#777;margin-bottom:34px}
.blog-body{font-size:1.45rem;line-height:1.75;white-space:pre-line}
.blog-body img{width:100%;border-radius:14px;margin:28px 0;display:block}
.blog-main-img-wrap{width:100%;margin:28px 0}
.blog-main-img{width:100%;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:4rem;overflow:hidden}
.blog-main-img img{width:100%;height:auto;display:block}
.blog-reactions{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0 30px}
.blog-bottom{position:fixed;left:0;right:0;bottom:74px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:14px 20px;display:flex;gap:28px;align-items:center;font-weight:900;z-index:160}
.blog-comment-section{background:#f7f7f7;margin:30px -20px -130px;padding:26px 20px 150px}
.inline-image-button{width:100%;height:46px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:800;margin-bottom:10px}
@media(min-width:900px){.blog-bottom{left:50%;right:auto;transform:translateX(-50%);max-width:500px;width:500px}}

/* CONTENTS STYLE */
.content-tabs{display:flex;gap:14px;overflow-x:auto;padding:18px 20px 10px;border-bottom:1px solid var(--line);scrollbar-width:none}
.content-tabs::-webkit-scrollbar{display:none}
.content-tabs button{height:46px;border-radius:999px;border:1px solid var(--line);background:#fff;padding:0 24px;font-size:.95rem;color:#555;font-family:inherit;white-space:nowrap}
.content-section{padding:30px 20px 8px}
.content-section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.content-section-head h2{font-size:1.55rem;letter-spacing:-.04em}
.content-section-head button{border:0;background:none;color:#777;font-size:.95rem}
.horizontal-row{display:grid;grid-auto-flow:column;grid-auto-columns:78%;gap:18px;overflow-x:auto;scrollbar-width:none}
.horizontal-row::-webkit-scrollbar{display:none}
.content-wide-card{cursor:pointer}
.content-wide-thumb{width:100%;aspect-ratio:16/9;border-radius:10px;background:#e8e8ec;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:2.2rem;position:relative}
.content-wide-thumb img{width:100%;height:100%;object-fit:cover}
.video-badge{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.72);color:#fff;border-radius:6px;padding:4px 7px;font-size:.78rem}
.content-wide-title{font-size:1.05rem;line-height:1.35;margin-top:10px;font-weight:600}
.content-wide-meta{font-size:.82rem;color:#777;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.content-all-head{padding:20px 20px 8px}
.content-all-head h1{font-size:2.2rem;line-height:1;font-weight:900;letter-spacing:-.06em}
.content-all-count{color:#999;font-weight:700;margin-top:16px}
.content-all-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px 16px;padding:20px}
.content-all-thumb{aspect-ratio:16/9;border-radius:10px;background:#e8e8ec;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:2rem}
.content-all-thumb img{width:100%;height:100%;object-fit:cover}
.content-all-title{font-size:1rem;line-height:1.35;font-weight:600;margin-top:10px}
.content-detail-media{width:100%;aspect-ratio:16/9;border-radius:18px;background:#e8e8ec;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:3rem;margin-bottom:18px}
.content-detail-media img{width:100%;height:100%;object-fit:cover}

/* NOTICE DETAIL STYLE */
.notice-detail-top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.notice-author-icon{width:48px;height:48px;border-radius:50%;background:#b894ff;display:grid;place-items:center;font-size:1.4rem;color:#fff}
.notice-author-name{font-size:1.15rem;font-weight:900}
.notice-manager{font-size:.76rem;background:#e6e6e6;border-radius:999px;padding:3px 7px;color:#666;margin-left:4px}
.notice-detail-title-big{font-size:1.75rem;line-height:1.25;font-weight:900;margin:16px 0 20px}
.notice-detail-image{width:100%;aspect-ratio:1.05;border-radius:16px;background:#e8e8ec;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:3rem;margin-bottom:20px}
.notice-detail-image img{width:100%;height:100%;object-fit:cover}
.notice-detail-body-big{font-size:1.35rem;line-height:1.7;white-space:pre-line;margin-bottom:40px}
.notice-bottom-bar{position:fixed;left:0;right:0;bottom:74px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:14px 20px;display:flex;gap:28px;align-items:center;font-weight:900;z-index:160}
@media(min-width:900px){.notice-bottom-bar{left:50%;right:auto;transform:translateX(-50%);max-width:500px;width:500px}}

/* MEMBER EDIT */
.member-edit-list{display:grid;gap:10px;margin-top:10px}
.member-edit-row{display:flex;align-items:center;justify-content:space-between;background:#f8f8f8;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.member-edit-left{display:flex;align-items:center;gap:10px;font-weight:800}
.member-edit-photo{width:38px;height:38px;border-radius:50%;background:#e8e8ec;display:grid;place-items:center;overflow:hidden}
.member-edit-photo img{width:100%;height:100%;object-fit:cover}
.member-edit-row button{height:34px;border-radius:999px;border:1px solid var(--line);background:#fff;padding:0 12px;font-weight:800}

function renderTalkFeed(){
 const list=posts.filter(p=>p.type==='talk'&&(!selectedTalkMember||p.memberId===selectedTalkMember));
 document.getElementById('talk-feed').innerHTML=list.length?list.map(p=>`<article class="feed-card" onclick="openPost(${p.id})"><div class="feed-head"><div class="feed-user"><div class="feed-avatar">${media(talkMembers.find(m=>m.id===p.memberId)?.photo||p.thumb||'👤')}</div><div class="feed-name">${p.memberName||'멤버'} <span class="verified">✓</span></div></div><button class="feed-more" onclick="event.stopPropagation();openPostMenu(event,\'post\',${p.id})">⋮</button></div><div class="feed-media">${String(p.thumb||'').startsWith('http')?`<img src="${p.thumb}">`:`<div class="emoji-media">${p.thumb||'💬'}</div>`}</div><div class="feed-title">${p.title}</div><div class="feed-meta">방금 전 · 좋아요 ${Number(p.likes||0).toLocaleString()} · 댓글 ${Number(p.comments||0).toLocaleString()}</div><div class="feed-comment"><b>${p.memberName||'멤버'}</b> ${p.body}</div><div class="reaction-row" onclick="event.stopPropagation()"><button class="react-btn" onclick="likeTalk(${p.id})">♡ ${Number(p.likes||0).toLocaleString()}</button><button class="react-btn" onclick="commentTalk(${p.id})">💬 ${Number(p.comments||0).toLocaleString()}</button></div></article>`).join(''):'<div class="meta">선택한 멤버의 게시글이 없습니다.</div>'
}
window.likeTalk=function(id){const p=posts.find(x=>x.id===id);if(!p)return;p.likes=(p.likes||0)+1;save();renderTalkFeed()}
window.commentTalk=function(id){const txt=prompt('댓글 내용을 입력하세요');if(!txt)return;const nick=prompt('닉네임을 입력하세요')||'익명';comments.unshift({id:Date.now(),postId:id,nickname:nick,photo:profile.photo||'👤',body:txt,time:'방금'});const p=posts.find(x=>x.id===id);if(p)p.comments=(p.comments||0)+1;save();openPost(id)}
window.editComment=function(id){const c=comments.find(x=>x.id===id);if(!c)return;const nick=prompt('닉네임 수정',c.nickname)||c.nickname;const body=prompt('댓글 내용 수정',c.body)||c.body;const photo=prompt('프로필 사진 URL 또는 이모지',c.photo)||c.photo;c.nickname=nick;c.body=body;c.photo=photo;save();openPost(c.postId)}
window.deleteComment=function(id){const c=comments.find(x=>x.id===id);if(!c)return;if(confirm('댓글을 삭제할까요?')){comments=comments.filter(x=>x.id!==id);const p=posts.find(x=>x.id===c.postId);if(p)p.comments=Math.max(0,(p.comments||1)-1);save();openPost(c.postId)}}
function renderCart(){const el=document.getElementById('cart-list');if(!el)return;el.innerHTML=cart.length?cart.map(c=>`<div class="cart-row"><div class="cart-thumb">${media(c.thumb)}</div><div class="cart-main"><div class="cart-title">${c.name}</div><div class="cart-meta">${c.price} · 수량 ${c.qty}</div><div class="qty"><button onclick="changeQty(${c.id},-1)">−</button><b>${c.qty}</b><button onclick="changeQty(${c.id},1)">+</button></div></div><button class="btn btn-danger" onclick="removeCart(${c.id})">삭제</button></div>`).join('')+`<button class="hero-btn" style="width:100%;margin-top:18px" onclick="checkoutCart()">장바구니 결제하기</button>`:'<div class="meta">장바구니가 비어있습니다.</div>'}
function cleanAlarms(){
 alarms=alarms.filter(a=>{
  if(!a.sourceType||!a.sourceId)return true;
  if(a.sourceType==='post')return posts.some(p=>p.id===a.sourceId);
  if(a.sourceType==='notice')return notices.some(n=>n.id===a.sourceId);
  if(a.sourceType==='board')return boardPosts.some(b=>b.id===a.sourceId);
  return true;
 });
}
function renderAlarms(){cleanAlarms();const dot=document.getElementById('alarm-dot');if(dot)dot.classList.toggle('on',alarms.some(a=>!a.read));const el=document.getElementById('alarm-list');if(!el)return;el.innerHTML=alarms.length?alarms.map(a=>`<div class="alarm-row"><div class="post-mini">${media(a.thumb)}</div><div class="alarm-main"><div class="alarm-title">${a.title}</div><div class="alarm-meta">${a.type} · ${a.time}</div></div></div>`).join(''):'<div class="meta">새 알림이 없습니다.</div>'}
window.openAlarms=function(){alarms=alarms.map(a=>({...a,read:true}));save();renderAlarms();switchPage('alarms')}
window.clearAlarms=function(){if(confirm('알림을 모두 초기화할까요?')){alarms=[];save();renderAlarms()}}
function updateFloatingButton(){
 const active=document.querySelector('.view.active')?.id;
 const btn=document.querySelector('.upload-btn');
 if(!btn)return;
 btn.style.display=active==='page-talk'?'block':'none';
}
window.switchPage=function(page){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById('page-'+page).classList.add('active');document.querySelectorAll('.nav-item').forEach(btn=>btn.classList.toggle('active',btn.dataset.page===page));window.scrollTo({top:0,behavior:'instant'});updateFloatingButton();if(page==='talk'){renderMemberStrip();renderTalkFeed()}}


window.openPostMenu=function(ev,type,id){
 const menu=document.getElementById('post-menu');
 menu.innerHTML=`<button onclick="handleMenuEdit('${type}',${id})">수정</button><button class="danger" onclick="handleMenuDelete('${type}',${id})">삭제</button>`;
 menu.style.left=Math.min(ev.clientX-110,window.innerWidth-140)+'px';
 menu.style.top=(ev.clientY+8)+'px';
 menu.classList.add('open');
}
window.handleMenuEdit=function(type,id){
 closePostMenu();
 if(type==='post')editPost(id);
 if(type==='comment')editComment(id);
}
window.handleMenuDelete=function(type,id){
 closePostMenu();
 if(type==='post')deletePost(id);
 if(type==='comment')deleteComment(id);
}
window.closePostMenu=function(){document.getElementById('post-menu').classList.remove('open')}
document.addEventListener('click',e=>{if(!e.target.closest('#post-menu')&&!e.target.closest('.feed-more')&&!e.target.closest('.comment-more'))closePostMenu()});

window.openPost=function(id){const p=posts.find(x=>x.id===id);editingPostId=id;
 if(p.type==='talk'){
  const member=talkMembers.find(m=>m.id===p.memberId);
  const list=comments.filter(c=>c.postId===p.id);
  document.getElementById('post-detail').innerHTML=`<div class="talk-detail-wrap"><button class="back" onclick="switchPage('talk')">‹ TALK</button><div class="talk-detail-head"><div class="talk-detail-user"><div class="talk-detail-avatar">${media(member?.photo||'👤')}</div><div><div class="talk-detail-name">${p.memberName||'멤버'} <span class="verified">✓</span></div><div class="talk-detail-time">1달 전</div></div></div><button class="talk-detail-more" onclick="openPostMenu(event,'post',${p.id})">⋮</button></div><div class="talk-detail-media">${String(p.thumb||'').startsWith('http')?`<img src="${p.thumb}">`:`<div class="emoji-media">${p.thumb||'💬'}</div>`}</div><div class="talk-detail-title">${p.title}</div><div class="talk-detail-reactions"><button class="react-btn">👍 ${Math.floor((p.likes||0)*.2+100).toLocaleString()}</button><button class="react-btn">💗 ${Number(p.likes||0).toLocaleString()}</button><button class="react-btn">🍿 ${Math.floor((p.likes||0)*.04+200).toLocaleString()}</button><button class="react-btn">✅ ${Math.floor((p.likes||0)*.03+200).toLocaleString()}</button></div><div class="comment-section"><div class="comment-title">댓글 ${Number(p.comments||list.length||0).toLocaleString()}</div><div class="comment-input" onclick="commentTalk(${p.id})">✎ 댓글 추가하기...</div>${list.map(c=>`<div class="comment-row"><div class="comment-avatar">${media(c.photo||'👤')}</div><div class="comment-body"><div class="comment-meta">${c.nickname||'익명'} · ${c.time||'방금'}</div><div class="comment-text">${c.body||''}</div></div><button class="comment-more" onclick="openPostMenu(event,'comment',${c.id})">⋮</button></div>`).join('')}</div></div><div class="talk-detail-bottom"><span>☺︎ 공감</span><span>💬 ${Number(p.comments||list.length||0).toLocaleString()}</span><span style="margin-left:auto">⋮</span></div>`;
  switchPage('post-detail');return;
 }
 const mediaBox=p.type==='content'?`<div class="content-detail-media">${media(p.thumb)}</div>`:`<div class="detail-thumb">${media(p.thumb)}</div>`;
 document.getElementById('post-detail').innerHTML=`<button class="back" onclick="switchPage('${p.type==='content'?'contents':'talk'}')">‹ BACK</button><div class="detail-main">${mediaBox}<div class="detail-title">${p.title}</div><div class="notice-meta" style="margin-bottom:14px">${p.type==='content'?'CONTENTS':'ATEEZ TALK'}</div><div class="detail-body">${p.body}</div><div class="actions-bottom"><button class="btn btn-light" onclick="editPost(${p.id})">수정</button><button class="btn btn-danger" onclick="deletePost(${p.id})">삭제</button></div></div>`;switchPage('post-detail')}
window.editPost=function(id){const p=posts.find(x=>x.id===id);modalMode='editPost';editingPostId=id;modalThumb=p.thumb;openModal('게시글 수정',p.title,p.body,'')}
window.deletePost=function(id){if(confirm('게시글을 삭제할까요?')){const p=posts.find(x=>x.id===id);posts=posts.filter(x=>x.id!==id);comments=comments.filter(c=>c.postId!==id);cleanAlarms();render();switchPage(p.type==='content'?'contents':'talk')}}

 document.getElementById('shop-detail-page').innerHTML=`

 <div class="shop-shipping-sub">국내·해외 배송이 가능한 상품이에요</div>
