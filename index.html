<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ATEEZ Official Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--line:#e5e5e5;--card:#f5f5f7;--sub:#777;--danger:#e63946;--blue:#7f91b5}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Pretendard,sans-serif;background:#fff;color:#111}
.app{padding-bottom:92px}
button{font-family:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);height:60px;padding:0 18px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:1.2rem;font-weight:900}
.header-actions{display:flex;gap:16px;align-items:center}
.header-actions button{border:0;background:none;font-size:1.28rem;position:relative}
.dot{display:none;position:absolute;right:-2px;top:-2px;width:8px;height:8px;background:#e63946;border-radius:50%}.dot.on{display:block}
.profile-mini{width:30px;height:30px;border-radius:50%;background:#eee;overflow:hidden;display:grid;place-items:center}.profile-mini img{width:100%;height:100%;object-fit:cover}
.view{display:none}.view.active{display:block}
.hero{padding:20px}.hero-card{min-height:220px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(135deg,#fff,#f2f2f2);padding:28px 22px;display:flex;flex-direction:column;justify-content:flex-end}.hero-card h1{font-size:2.2rem;line-height:1;letter-spacing:-.05em;margin-bottom:10px}.hero-card p{font-size:.92rem;color:#777;margin-bottom:18px}
.primary{height:48px;border:0;border-radius:999px;background:#111;color:#fff;font-weight:900;padding:0 18px}
.section{padding:20px}.section-title{font-size:1.1rem;font-weight:900;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{border:1px solid #ececec;border-radius:22px;background:var(--card);overflow:hidden}.thumb{aspect-ratio:1/1;background:#e8e8ec;display:flex;align-items:center;justify-content:center;font-size:2rem;overflow:hidden}.thumb img,.mini img,.photo img,.big-media img,.cart-thumb img,.member-photo img{width:100%;height:100%;object-fit:cover}.info{padding:12px}.title{font-size:.93rem;font-weight:800;line-height:1.35}.meta{font-size:.78rem;color:#777;margin-top:5px}
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;height:74px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:space-around;z-index:200}
.nav-item{border:0;background:none;color:#777;font-size:.62rem;font-weight:700;display:flex;flex-direction:column;gap:4px;align-items:center}.nav-item.active{color:#111}
.fab{display:none;position:fixed;right:20px;bottom:96px;width:58px;height:58px;border-radius:50%;border:0;background:#111;color:#fff;font-size:1.8rem;z-index:210}
.back{border:0;background:none;font-weight:900;color:#555;margin-bottom:16px}
.detail{padding:20px}.detail-card{border:1px solid #ececec;background:var(--card);border-radius:24px;padding:18px}.detail-title{font-size:1.55rem;font-weight:900;line-height:1.25;margin:14px 0}.detail-body{font-size:1rem;line-height:1.65;white-space:pre-line;color:#444}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{height:44px;border-radius:999px;border:0;font-weight:900;padding:0 16px}.light{background:#fff;border:1px solid var(--line)}.danger{background:var(--danger);color:#fff}
.modal{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.35);align-items:flex-end}.modal.open{display:flex}.sheet{width:100%;background:#fff;border-radius:24px 24px 0 0;padding:20px;max-height:88vh;overflow:auto}.sheet h3{font-size:1.1rem;margin-bottom:14px}.input,.textarea{width:100%;border:1px solid var(--line);border-radius:16px;padding:14px;font-family:inherit;font-size:.95rem;margin-bottom:10px}.textarea{min-height:120px;resize:vertical}.preview{height:92px;border:1px solid var(--line);background:#f5f5f5;border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:10px;color:#888}.preview img{width:100%;height:100%;object-fit:cover}


/* HOME CONTENT CARDS */
.home-list{display:flex;flex-direction:column;gap:22px}
.home-content-card{background:#fff;border:1px solid #ededed;border-radius:24px;overflow:hidden;box-shadow:0 10px 28px rgba(0,0,0,.045)}
.home-content-thumb{width:100%;aspect-ratio:16/9;background:#e8e8ec;display:grid;place-items:center;overflow:hidden;font-size:2.6rem;position:relative}
.home-content-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.home-content-badge{position:absolute;right:14px;bottom:14px;background:rgba(0,0,0,.62);color:#fff;border-radius:999px;padding:7px 10px;font-size:.76rem;font-weight:800;backdrop-filter:blur(8px)}
.home-content-info{padding:16px 16px 18px}
.home-content-title{font-size:1.28rem;font-weight:900;line-height:1.28;letter-spacing:-.04em}
.home-content-meta{margin-top:8px;color:#777;font-size:.92rem;font-weight:700}
.home-content-desc{margin-top:14px;color:#555;font-size:.98rem;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* CONTENT CATEGORY PILLS */
.content-tabs-clean{display:flex;gap:10px;overflow-x:auto;padding:18px 20px 8px;border-bottom:0;scrollbar-width:none}
.content-tabs-clean::-webkit-scrollbar{display:none}
.content-tabs-clean button{height:42px;border:1px solid #ddd;background:#f7f7f8;border-radius:999px;padding:0 18px;font-size:.9rem;font-weight:900;color:#333;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.035)}
.content-tabs-clean button:active{transform:scale(.98);background:#111;color:#fff;border-color:#111}
.content-section{padding-top:34px}
.content-head h2{letter-spacing:-.04em}
.content-head .btn{height:48px;min-width:104px;border-radius:999px;color:#2175d9;background:#fff;font-size:.92rem}
.row-scroll{grid-auto-columns:78%;padding-bottom:4px;scrollbar-width:none}.row-scroll::-webkit-scrollbar{display:none}
.wide-thumb{border-radius:18px;background:#e9e9ee}.wide-title{font-size:1.1rem;font-weight:900;letter-spacing:-.03em}.wide-title+.meta,.row-scroll .meta{font-size:.88rem}

/* SELECT SHEET */
.modal-field-label{font-size:.78rem;font-weight:900;color:#777;margin:8px 0 6px}
.select-like{width:100%;height:48px;border:1px solid var(--line);background:#f7f7f8;border-radius:16px;margin-bottom:10px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;font-weight:900;color:#111}
.category-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.34);z-index:700;align-items:flex-end}.category-modal.open{display:flex}
.category-panel{width:100%;background:#fff;border-radius:24px 24px 0 0;padding:16px 20px 28px;box-shadow:0 -18px 50px rgba(0,0,0,.16)}
.category-option{width:100%;height:52px;border:0;background:#fff;border-radius:14px;text-align:left;padding:0 14px;font-size:1rem;font-weight:900;color:#111}.category-option.active{background:#111;color:#fff}.category-option+ .category-option{margin-top:6px}

/* TALK */
.member-strip{display:flex;gap:18px;overflow-x:auto;padding:18px 20px;border-bottom:1px solid var(--line)}.member-strip::-webkit-scrollbar{display:none}.member-chip{border:0;background:none;min-width:72px;color:#777}.member-chip.active{color:#111}.member-photo{width:66px;height:66px;border-radius:50%;background:#e8e8ec;display:grid;place-items:center;font-size:1.7rem;margin:0 auto 8px;overflow:hidden;border:2px solid transparent}.member-chip.active .member-photo{border-color:#111}.member-name{font-size:.82rem;font-weight:900}
.feed{padding:20px 20px 120px}.feed-card{padding:20px 0;border-bottom:1px solid var(--line);position:relative}.feed-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.feed-user{display:flex;gap:10px;align-items:center}.photo{width:44px;height:44px;border-radius:50%;background:#e8e8ec;display:grid;place-items:center;overflow:hidden}.name{font-weight:900;font-size:1.05rem}.check{background:#0b3b77;color:white;border-radius:50%;font-size:.72rem;padding:2px 5px}.more{border:0;background:none;font-size:1.5rem;color:#777}.feed-img{width:100%;aspect-ratio:1/1;border-radius:18px;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:4rem;color:white}.feed-img img{width:100%;height:100%;object-fit:cover}.feed-title{font-size:1.28rem;font-weight:600;line-height:1.35;margin:14px 0}.react{display:flex;gap:10px;flex-wrap:wrap}.react button{height:38px;border-radius:999px;border:1px solid var(--line);background:#f8f8f8;font-weight:900;padding:0 14px}
.menu{display:none;position:absolute;background:#fff;border:1px solid var(--line);box-shadow:0 12px 28px rgba(0,0,0,.15);border-radius:14px;padding:8px;z-index:900}.menu.open{display:block}.menu button{display:block;width:120px;height:38px;border:0;background:#fff;text-align:left;padding:0 12px;font-weight:900;border-radius:10px}.menu button.danger{color:var(--danger)}
.talk-detail{padding:20px 20px 130px}.big-media{width:100%;border-radius:18px;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:4rem;color:white;margin-bottom:20px}.big-media img{width:100%;height:auto;display:block}.comment-box{background:#f7f7f7;margin:30px -20px -130px;padding:26px 20px 150px}.comment-row{display:flex;gap:12px;margin-bottom:24px;position:relative}.comment-avatar{width:34px;height:34px;border-radius:50%;background:#d9ddff;display:grid;place-items:center;overflow:hidden;flex-shrink:0}.comment-meta{font-size:.92rem;color:#888;margin-bottom:6px}.comment-text{font-size:1rem;line-height:1.5}.fixed-bar{position:fixed;left:0;right:0;bottom:74px;background:#fff;border-top:1px solid var(--line);padding:14px 20px;display:flex;gap:28px;font-weight:900;z-index:180}

/* CONTENTS */
.tabs{display:flex;gap:14px;overflow-x:auto;padding:16px 20px;border-bottom:1px solid var(--line)}.tabs button{height:44px;border-radius:999px;border:1px solid var(--line);background:#fff;padding:0 20px;font-weight:800;white-space:nowrap}
.content-section{padding:24px 20px}.content-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.content-head h2{font-size:1.45rem}.row-scroll{display:grid;grid-auto-flow:column;grid-auto-columns:78%;gap:16px;overflow-x:auto}.wide-thumb{aspect-ratio:16/9;border-radius:12px;background:#e8e8ec;display:grid;place-items:center;overflow:hidden;font-size:2rem}.wide-thumb img{width:100%;height:100%;object-fit:cover}.wide-title{font-weight:700;line-height:1.35;margin-top:10px}.all-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px 16px;padding:20px}.content-detail-img{aspect-ratio:16/9;border-radius:18px;background:#e8e8ec;display:grid;place-items:center;overflow:hidden}.content-detail-img img{width:100%;height:100%;object-fit:cover}

/* SHOP */
.shop-tabs{display:flex;gap:20px;overflow-x:auto;padding:0 20px 18px;border-bottom:1px solid var(--line)}.shop-tabs button{border:0;background:none;font-size:1.1rem;font-weight:900;color:#888;padding:12px 0;border-bottom:3px solid transparent}.shop-tabs button.active{color:#111;border-bottom-color:#111}.shop-hero{width:100%;aspect-ratio:1/1;background:#f5f5f7;display:grid;place-items:center;overflow:hidden;font-size:4rem}.shop-hero img{width:100%;height:100%;object-fit:cover}.shop-info{padding:24px 20px}.shop-title{font-size:1.18rem;font-weight:900;line-height:1.28}.shop-price{font-size:1.55rem;font-weight:900;margin-top:12px}.shop-desc{margin-top:32px;border-top:12px solid #f5f5f7;padding-top:28px}.shop-bottom{position:fixed;left:0;right:0;bottom:0;background:white;border-top:1px solid var(--line);padding:14px 16px;display:flex;gap:12px;z-index:300}.shop-bottom button{height:60px;border-radius:18px;font-size:1.15rem;font-weight:900;flex:1}.cart-btn{background:white;border:2px solid #111}.buy-btn{background:var(--blue);color:white;border:0}

/* MY */
.my-menu{padding:0 20px 28px}.my-row{background:var(--card);border:1px solid #ececec;border-radius:18px;padding:17px 16px;margin-bottom:10px;font-weight:900;display:flex;justify-content:space-between}.cart-row{display:flex;gap:14px;padding:14px;border:1px solid var(--line);border-radius:20px;background:#fff;margin-bottom:14px}.cart-thumb{width:82px;height:82px;border-radius:16px;background:#f4f4f4;display:grid;place-items:center;overflow:hidden;flex-shrink:0}.cart-main{flex:1}.cart-title{font-weight:900}.cart-meta{color:#888;font-size:.9rem;margin-top:8px}

.member-page-head{display:flex;align-items:center;gap:12px;padding:24px 20px 8px}
.member-page-head .back{font-size:1.35rem;min-width:28px}.member-page-head h1{font-size:1.55rem;font-weight:900;letter-spacing:-.05em}
.member-pill{background:#eee;border-radius:999px;padding:6px 10px;font-size:.8rem;font-weight:800;color:#555}
.member-card-wrap{padding:42px 20px 130px;text-align:center}
.member-flip{perspective:1200px}
.membership-card{width:78%;max-width:330px;aspect-ratio:.72/1;margin:0 auto 30px;position:relative;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .5s;-webkit-transition:-webkit-transform .5s}
.membership-card.flip{transform:rotateY(180deg);-webkit-transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:28px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 24px 44px rgba(0,0,0,.08);overflow:hidden}
.front{transform:rotateY(0deg);-webkit-transform:rotateY(0deg);background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.95),rgba(255,255,255,.62) 38%,rgba(238,241,250,.70) 62%,rgba(255,255,255,.92)),radial-gradient(circle at 20% 80%,rgba(191,255,242,.55),transparent 28%),radial-gradient(circle at 80% 30%,rgba(214,219,255,.55),transparent 32%),linear-gradient(135deg,#fff,#eef2f8,#fff);display:flex;align-items:center;justify-content:center;text-align:center;color:#9c9c9c;font-size:1.25rem;font-weight:900;line-height:1.35}
.front:before{content:"✦ ✧ ✶ ✧ ✦ ✧ ✶ ✦ ✧";position:absolute;inset:0;color:rgba(255,255,255,.8);font-size:1.4rem;letter-spacing:14px;line-height:2.5;filter:blur(.1px);opacity:.95}
.front:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.35),rgba(255,255,255,0) 45%,rgba(255,255,255,.55));mix-blend-mode:screen}
.front span{position:relative;z-index:1}
.backface{transform:rotateY(180deg);-webkit-transform:rotateY(180deg);background:#f2f1fa;text-align:left;display:flex}
.backface:before{content:"";width:28%;background:rgba(0,0,0,.045);border-right:1px solid rgba(0,0,0,.06)}
.back-inner{padding:24px 18px 18px;flex:1;font-size:.82rem;line-height:1.32;overflow:hidden;display:flex;flex-direction:column}
.label{font-size:.72rem;margin-top:10px;color:#333}
.big{font-size:1.05rem;font-weight:900;margin-top:2px;word-break:break-all;line-height:1.15}
.member-card-dot{width:10px;height:10px;background:#111;border-radius:50%;margin:0 auto 34px}
.member-title{font-size:1.35rem;font-weight:900;letter-spacing:-.04em}
.member-sub{font-size:1.05rem;color:#555;margin-top:10px}
.member-detail-btn{width:100%;height:64px;border:0;border-radius:14px;background:#7d8fb7;color:#fff;font-size:1.2rem;font-weight:900;margin-top:48px}

@media(min-width:900px){body{background:#efefef}.app{max-width:500px;margin:0 auto;background:#fff;min-height:100vh}.bottom-nav,.fixed-bar{left:50%;transform:translateX(-50%);max-width:500px}.shop-bottom{left:50%;transform:translateX(-50%);max-width:500px}.modal,.category-modal{left:50%;transform:translateX(-50%);max-width:500px}.fab{right:calc(50% - 230px)}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo" onclick="go('home')">ATEEZ</div>
  <div class="header-actions">
    <button onclick="openAlerts()">🔔<span class="dot" id="alertDot"></span></button>
    <button onclick="openCart()">🛒</button>
    <button class="profile-mini" onclick="go('my')" id="topProfile">👤</button>
  </div>
</header>

<main>
<section class="view active" id="home">
  <div class="hero"><div class="hero-card"><h1>GOLDEN<br>HOUR</h1><p id="welcome">ATEEZ Official Platform</p><button class="primary" onclick="openMembership()">멤버십 가입하기</button></div></div>
  <div class="section"><div class="section-title">LATEST CONTENTS</div><div class="grid" id="homeGrid"></div></div>
</section>

<section class="view" id="talk"><div class="member-strip" id="memberStrip"></div><div class="feed" id="talkFeed"></div></section>
<section class="view" id="postDetail"><div id="postDetailBox"></div></section>

<section class="view" id="contents">
  <div class="section-title" style="padding:18px 20px 0"><span>CONTENTS</span></div>
  <div class="content-tabs-clean"><button onclick="openBoard('notice')">NOTICE</button><button onclick="openBoard('event')">EVENT</button><button onclick="openBoard('broadcast')">공방공지</button></div>
  <div id="contentSections"></div>
</section>
<section class="view" id="contentAll"><div id="contentAllBox"></div></section>
<section class="view" id="board"><div id="boardBox"></div></section>
<section class="view" id="boardDetail"><div id="boardDetailBox"></div></section>

<section class="view" id="notice"><div class="section"><div class="section-title">NOTICE <button class="btn light" onclick="openAddNotice()">+ 공지</button></div><div id="noticeList"></div></div></section>
<section class="view" id="noticeDetail"><div id="noticeDetailBox"></div></section>

<section class="view" id="shop"><div class="section-title" style="padding:18px 20px 0"><span>SHOP</span><button class="primary" onclick="openAddProduct()">+ 상품 추가</button></div><div class="hero"><div class="hero-card"><h1>OUR ETERNAL<br>STAR ATINY</h1><p>Official Membership & Goods</p></div></div><div class="shop-tabs" id="shopTabs"></div><div class="section"><div class="grid" id="shopGrid"></div></div></section>
<section class="view" id="shopDetail"><div id="shopDetailBox"></div></section>
<section class="view" id="cart"><div class="section"><div class="section-title">장바구니</div><div id="cartList"></div></div></section>
<section class="view" id="alerts"><div class="section"><div class="section-title">알림 <button class="btn danger" onclick="clearAlerts()">초기화</button></div><div id="alertList"></div></div></section>

<section class="view" id="my">
  <div class="hero"><div class="hero-card"><h1>MY<br>PAGE</h1><p id="myNick">닉네임 미설정</p><button class="primary" onclick="openProfile()">프로필 관리</button></div></div>
  <div class="my-menu">
    <div class="my-row" onclick="openMembership()">내 멤버십 <span>›</span></div>
    <div class="my-row" onclick="openOrders()">주문 내역 <span>›</span></div>
    <div class="my-row" onclick="openMyPosts()">내가 쓴 글 <span>›</span></div>
    <div class="my-row" onclick="openProfile()">내 정보 관리 <span>›</span></div>
    <div class="my-row" style="color:var(--danger)" onclick="logout()">로그아웃 <span>›</span></div>
  </div>
</section>
<section class="view" id="myDetail"><div id="myDetailBox"></div></section>
<section class="view" id="membership"><div id="membershipBox"></div></section>
</main>

<button class="fab" id="fab" onclick="openAddTalk()">＋</button>
<nav class="bottom-nav">
<button class="nav-item active" data-page="home" onclick="go('home')">🏠<span>HOME</span></button>
<button class="nav-item" data-page="talk" onclick="go('talk')">💬<span>TALK</span></button>
<button class="nav-item" data-page="contents" onclick="go('contents')">▶️<span>CONTENTS</span></button>
<button class="nav-item" data-page="shop" onclick="go('shop')">🛍️<span>SHOP</span></button>
<button class="nav-item" data-page="notice" onclick="go('notice')">🔔<span>NOTICE</span></button>
</nav>
</div>

<div class="menu" id="menu"></div>
<div class="category-modal" id="categoryModal"><div class="category-panel" id="categoryPanel"></div></div>
<div class="modal" id="modal"><div class="sheet">
<h3 id="modalTitle">작성</h3>
<div id="thumbBlock"><div class="preview" id="thumbPreview">이미지 없음</div><button class="btn light" style="width:100%;margin-bottom:10px" onclick="pickThumb()">이미지 첨부</button></div>
<div id="profileBlock" style="display:none"><div class="preview" id="profilePreview">프로필 사진 없음</div><button class="btn light" style="width:100%;margin-bottom:10px" onclick="pickProfilePhoto()">프로필 사진 첨부</button></div>
<div id="pickerArea" style="display:none"></div><div id="categoryFields" style="display:none"><div class="modal-field-label" id="memberLabel">멤버 카테고리</div><button type="button" class="select-like" id="memberCategorySelect" onclick="openSelectModal('member')"><span id="memberCategoryText">선택</span><span>⌄</span></button><div class="modal-field-label" id="postLabel">글 카테고리</div><button type="button" class="select-like" id="postCategorySelect" onclick="openSelectModal('post')"><span id="postCategoryText">예능</span><span>⌄</span></button><div id="visibilityRow"><div class="modal-field-label">공개 설정</div><button type="button" class="select-like" id="visibilitySelect" onclick="openSelectModal('visibility')"><span id="visibilityText">전체공개</span><span>⌄</span></button></div></div><input class="input" id="mTitle" placeholder="제목">
<textarea class="textarea" id="mBody" placeholder="내용"></textarea>
<input class="input" id="mMeta" placeholder="메타/가격/전화번호">
<div style="display:flex;gap:10px"><button class="btn primary" id="saveBtn" onclick="saveModal()">저장</button><button class="btn light" onclick="closeModal()">취소</button></div>
</div></div>

<script type="module">

}
window.openSelectModal=function(type){
 const modal=document.getElementById('categoryModal');
 const panel=document.getElementById('categoryPanel');
 let options=[];
 if(type==='member') options=members.map(m=>({label:m.name,value:m.id,active:selectedPostMember===m.id}));
 if(type==='post') options=postCategoryOptions.map(v=>({label:v,value:v,active:selectedPostCategory===v}));
 if(type==='product') options=['MEMBERSHIP','ALBUM','PRODUCTS'].map(v=>({label:v,value:v,active:selectedProductCat===v}));
 if(type==='visibility') options=[{label:'전체공개',value:'public',active:selectedVisibility==='public'},{label:'멤버십 공개',value:'member',active:selectedVisibility==='member'}];
 panel.innerHTML=options.map(o=>`<button type="button" class="category-option ${o.active?'active':''}" onclick="chooseCategory('${type}','${o.value}')">${o.label}</button>`).join('');
 modal.classList.add('open');
}
window.chooseCategory=function(type,value){
 if(type==='member') selectedPostMember=value;
 if(type==='post') selectedPostCategory=value;
 if(type==='product') selectedProductCat=value;
 if(type==='visibility') selectedVisibility=value;
 document.getElementById('categoryModal').classList.remove('open');
 updateCategoryTexts();
 if(type==='product') renderProductCategoryField();
}
function renderProductCategoryField(){
 const box=document.getElementById('pickerArea');
 if(!box)return;
 box.style.display='block';
 box.innerHTML=`<div class="modal-field-label">상품 카테고리</div><button type="button" class="select-like" onclick="openSelectModal('product')"><span>${selectedProductCat}</span><span>⌄</span></button>`;
}
document.addEventListener('click',e=>{if(e.target.id==='categoryModal')e.target.classList.remove('open')});

function openModal(title,a='',b='',c=''){document.getElementById('modalTitle').textContent=title;document.getElementById('mTitle').value=a;document.getElementById('mBody').value=b;document.getElementById('mMeta').value=c;document.getElementById('thumbBlock').style.display='block';document.getElementById('profileBlock').style.display='none';document.getElementById('mBody').style.display='block';document.getElementById('mMeta').style.display='block';document.getElementById('thumbPreview').innerHTML=tempImg?media(tempImg):'이미지 없음';document.getElementById('saveBtn').textContent='저장';document.getElementById('pickerArea').style.display='none';document.getElementById('categoryFields').style.display='none';const cf=document.getElementById('categoryFields'); if(cf) cf.style.display='none'; document.getElementById('modal').classList.add('open')}
window.closeModal=()=>document.getElementById('modal').classList.remove('open')
window.pickThumb=async()=>{let u=await upload();if(u){tempImg=u;document.getElementById('thumbPreview').innerHTML=media(u)}}
window.pickProfilePhoto=async()=>{let u=await upload();if(u){tempProfile=u;document.getElementById('profilePreview').innerHTML=media(u)}}
window.openAddTalk=()=>{modalMode='talk';tempImg='';selectedPostMember=currentMember||members[0].id;selectedPostCategory='예능';openModal('TALK 게시글 추가','','','');document.getElementById('mMeta').style.display='none';document.getElementById('categoryFields').style.display='block';document.getElementById('visibilityRow').style.display='none';updateCategoryTexts()}
window.openAddProduct=()=>{modalMode='product';tempImg='';selectedProductCat='PRODUCTS';openModal('상품 추가','','','');document.getElementById('mMeta').placeholder='가격';renderProductCategoryField()}
window.openAddContent=()=>{modalMode='content';tempImg='';openModal('콘텐츠 추가','','','video');document.getElementById('mMeta').placeholder='카테고리 golden/video/atiny/log'}
window.openAddContentFor=(cat)=>{modalMode='content';tempImg='';selectedVisibility='public';openModal('콘텐츠 추가','','',cat);document.getElementById('mMeta').placeholder='카테고리';document.getElementById('categoryFields').style.display='block';document.getElementById('memberLabel').style.display='none';document.getElementById('memberCategorySelect').style.display='none';document.getElementById('postLabel').style.display='none';document.getElementById('postCategorySelect').style.display='none';document.getElementById('visibilityRow').style.display='block';updateCategoryTexts()}
window.openAddNotice=()=>{modalMode='notice';tempImg='';openModal('공지 추가','','','');document.getElementById('thumbBlock').style.display='none'}
window.openJoin=()=>{modalMode='join';openModal('멤버십 가입 정보','','','');document.getElementById('thumbBlock').style.display='none';document.getElementById('mTitle').placeholder='이름';document.getElementById('mBody').placeholder='생년월일';document.getElementById('mMeta').placeholder='전화번호';document.getElementById('saveBtn').textContent='최종 결제 진행'}

window.saveModal=()=>{let title=document.getElementById('mTitle').value.trim(),body=document.getElementById('mBody').value.trim(),meta=document.getElementById('mMeta').value.trim();if(modalMode==='profile'){profile.nickname=title;profile.photo=tempProfile;closeModal();render();return}if(modalMode==='join'){if(!title||!body||!meta)return alert('전부 입력해줘');let now=new Date(),end=new Date();end.setFullYear(now.getFullYear()+1);membership={name:title,birth:body,phone:meta,code:code(),start:now.toISOString(),end:end.toISOString()};orders.unshift({id:uid(),name:'ATINY MEMBERSHIP',price:'20,000원',thumb:'💎',qty:1,date:fmt(now)});closeModal();render();openMembership();return}if(!title)return alert('제목을 입력해줘');if(modalMode==='editProduct'){
  let p=products.find(x=>x.id===editId);
  if(p){const cat=selectedProductCat||p.cat||'PRODUCTS';p.name=title;p.body=body;p.price=meta||p.price;p.thumb=tempImg||p.thumb;p.cat=cat;p.membership=cat==='MEMBERSHIP';}
  closeModal();save();render();openProduct(editId);return;
}if(modalMode==='talk'){let m=members.find(x=>x.id===selectedPostMember)||members.find(x=>x.id===currentMember)||members[0];let p={id:uid(),type:'talk',member:m.id,postCategory:selectedPostCategory,title,body,thumb:tempImg||'',likes:0,comments:0,author:'ME',created:'방금 작성'};posts.unshift(p);alerts.unshift({id:uid(),type:'게시글',title,thumb:p.thumb,time:'방금',read:false,source:p.id})}if(modalMode==='content'){let p={id:uid(),type:'content',cat:meta||'video',title,body,thumb:tempImg||'',author:'ME',created:'방금 작성',visibility:selectedVisibility||'public'};posts.unshift(p);alerts.unshift({id:uid(),type:'콘텐츠',title,thumb:p.thumb,time:'방금',read:false,source:p.id})}if(modalMode==='product'){const cat=selectedProductCat||'PRODUCTS';products.unshift({id:uid(),name:title,body:body||'상품 설명',price:meta||'0원',thumb:tempImg||'🛍️',cat,membership:cat==='MEMBERSHIP'});shopCat=cat;closeModal();save();render();go('shop');return}if(modalMode==='notice'){let n={id:uid(),title,body,meta:'KQ엔터테인먼트 · 방금'};notices.unshift(n);alerts.unshift({id:uid(),type:'공지',title,thumb:'🔔',time:'방금',read:false,source:n.id})}closeModal();render()}

window.likePost=id=>{let p=posts.find(x=>x.id===id);p.likes=(p.likes||0)+1;renderTalk();save()}
window.addComment=id=>{let body=prompt('댓글 내용');if(!body)return;let nick=prompt('닉네임')||profile.nickname||'익명';comments.unshift({id:uid(),post:id,nick,photo:profile.photo||'👤',body,time:'방금'});let p=posts.find(x=>x.id===id);p.comments=(p.comments||0)+1;save();openPost(id)}
window.openMenu=(e,type,id)=>{e.stopPropagation();let m=document.getElementById('menu');m.style.left=Math.min(e.clientX-110,innerWidth-140)+'px';m.style.top=e.clientY+8+'px';m.innerHTML=`<button onclick="menuEdit('${type}',${id})">수정</button><button class="danger" onclick="menuDel('${type}',${id})">삭제</button>`;m.classList.add('open')}
window.menuEdit=(type,id)=>{document.getElementById('menu').classList.remove('open');if(type==='comment'){let c=comments.find(x=>x.id===id);c.nick=prompt('닉네임',c.nick)||c.nick;c.photo=prompt('프로필 사진 URL/이모지',c.photo)||c.photo;c.body=prompt('내용',c.body)||c.body;save();openPost(c.post)}else editPost(id)}
window.menuDel=(type,id)=>{document.getElementById('menu').classList.remove('open');if(type==='comment'){let c=comments.find(x=>x.id===id);comments=comments.filter(x=>x.id!==id);save();openPost(c.post)}else deletePost(id)}
document.addEventListener('click',e=>{if(!e.target.closest('#menu')&&!e.target.closest('.more'))document.getElementById('menu').classList.remove('open')})
window.editPost=id=>{let p=posts.find(x=>x.id===id);modalMode=p.type;editId=id;tempImg=p.thumb;openModal('게시글 수정',p.title,p.body,p.cat||'')}
window.deletePost=id=>{let p=posts.find(x=>x.id===id);if(confirm('삭제할까요?')){posts=posts.filter(x=>x.id!==id);comments=comments.filter(c=>c.post!==id);alerts=alerts.filter(a=>a.source!==id);save();render();go(p.type==='content'?'contents':'talk')}}
window.editProduct=id=>{
  const p=products.find(x=>x.id===id);
  if(!p)return;
  modalMode='editProduct';
  editId=id;
  tempImg=p.thumb||'';
  selectedProductCat=p.cat||'PRODUCTS';
  openModal('상품 수정',p.name||'',p.body||'',p.price||'');
  renderProductCategoryField();
  document.getElementById('mMeta').placeholder='가격';
  document.getElementById('thumbPreview').innerHTML=tempImg?media(tempImg):'이미지 없음';
}
window.deleteProduct=id=>{products=products.filter(p=>p.id!==id);save();render();go('shop')}
window.editNotice=id=>alert('공지 수정은 다음 단계에서 연결 가능')
window.deleteNotice=id=>{notices=notices.filter(n=>n.id!==id);alerts=alerts.filter(a=>a.source!==id);save();render();go('notice')}

async function upload(){return new Promise(resolve=>{let i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{let f=i.files[0];if(!f)return resolve('');let fd=new FormData();fd.append('file',f);fd.append('upload_preset',CLOUDINARY_PRESET);try{let r=await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`,{method:'POST',body:fd});let d=await r.json();resolve(d.secure_url||'')}catch(e){alert('업로드 실패');resolve('')}};i.click()})}

render();console.log('Firebase + Cloudinary Connected',db);
</script>
