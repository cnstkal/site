<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>ATEEZ Official Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--text:#111;--sub:#8d8d8d;--line:#eee;--soft:#f7f7f8;--red:#ff4545;--gold:#d89b13;--nav-h:76px;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{font-family:'Pretendard',system-ui,sans-serif;background:#fff;color:var(--text);overflow-x:hidden}.app{min-height:100vh;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));background:#fff}.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);padding:18px 18px 12px;border-bottom:1px solid #f5f5f5}.top-row{height:42px;display:flex;align-items:center;justify-content:space-between;gap:14px}.left{display:flex;align-items:center;gap:20px}.hamb{font-size:2rem;line-height:1}.logo{font-weight:900;font-style:italic;font-size:1.35rem;letter-spacing:-.09em}.icons{display:flex;align-items:center;gap:20px;font-size:1.55rem}.profile{width:38px;height:38px;border-radius:50%;background:#cdd3ff;display:grid;place-items:center;color:#6170d9}.view{display:none}.view.active{display:block}.hero-img{height:230px;background:linear-gradient(135deg,#08384a,#0d1d3e 65%,#06111c);display:flex;align-items:center;justify-content:center;color:#e8c872;text-align:center;padding:24px}.hero-img h1{font-size:1.9rem;font-weight:900;letter-spacing:-.04em}.dots{text-align:center;padding:14px 0 26px}.dots span{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ddd;margin:0 4px}.dots span:first-child{background:#111}.tabs{display:flex;gap:32px;overflow-x:auto;padding:0 18px 12px;border-bottom:1px solid var(--line);white-space:nowrap}.tabs button{border:0;background:0;font-size:1.15rem;font-weight:900;color:#aaa;padding:12px 0;position:relative}.tabs button.active{color:#111}.tabs button.active:after{content:'';position:absolute;left:0;right:0;bottom:-13px;height:3px;background:#111}.section{padding:22px 18px}.section-title{font-size:1.2rem;font-weight:900;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.product img,.thumb{width:100%;aspect-ratio:1;border-radius:8px;background:#eee;display:grid;place-items:center;font-size:2.5rem;object-fit:cover}.p-name{font-size:1.05rem;line-height:1.35;font-weight:500;margin-top:12px}.price{font-size:1.35rem;font-weight:900;margin-top:8px}.badge{color:var(--gold);font-size:.9rem;font-weight:900;margin-top:12px}.notice-fixed{background:#fafafa;padding:18px;border-bottom:1px solid var(--line)}.fixed-head{font-size:1.18rem;font-weight:900;margin-bottom:18px}.fixed-list{display:grid;gap:18px}.fixed-item{display:flex;justify-content:space-between;gap:12px;font-size:1.05rem}.count{color:var(--red);font-weight:800}.time{color:#888;white-space:nowrap}.post-list{padding:18px}.post{display:grid;grid-template-columns:1fr 82px;gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}.post-title{font-size:1.12rem;line-height:1.35}.post-meta{color:#999;margin:8px 0;font-size:.9rem}.post-comment{font-weight:700;color:#222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.post-thumb{width:82px;height:82px;border-radius:8px;background:#eee;display:grid;place-items:center}.talk-card{padding:18px;border-bottom:1px solid var(--line);display:flex;gap:14px}.avatar{width:48px;height:48px;border-radius:50%;background:#eee;display:grid;place-items:center;font-size:1.4rem}.talk-body{flex:1}.talk-name{font-weight:900}.talk-text{font-size:1rem;margin-top:6px;line-height:1.45}.chat{display:flex;gap:14px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}.chat-info{flex:1}.chat-name{font-weight:900}.chat-msg{color:#777;margin-top:4px}.dot{width:9px;height:9px;background:var(--red);border-radius:50%}.content-card{background:#fafafa;border-radius:18px;padding:16px;margin-bottom:14px}.content-title{font-weight:900;font-size:1.1rem}.content-meta{color:#888;margin-top:6px}.my-box{margin:18px;border:1px solid var(--line);border-radius:20px;padding:20px;background:#fafafa}.my-title{font-size:1.3rem;font-weight:900}.row{display:flex;justify-content:space-between;padding:18px 0;border-bottom:1px solid var(--line);font-weight:700}.row:last-child{border-bottom:0}.bottom{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(7,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:80}.nav{border:0;background:0;color:#777;font-size:.68rem;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.nav .ico{font-size:1.35rem}.nav.active{color:#111}.empty{padding:40px 18px;color:#999;text-align:center}.upload{position:fixed;right:18px;bottom:calc(var(--nav-h) + 22px);width:52px;height:52px;border-radius:50%;border:0;background:#111;color:#fff;font-size:1.7rem;z-index:70;box-shadow:0 8px 30px rgba(0,0,0,.18)}@media(min-width:900px){body{background:#f0f0f0}.app{max-width:520px;margin:0 auto;box-shadow:0 0 40px rgba(0,0,0,.08);position:relative}.bottom{left:50%;right:auto;transform:translateX(-50%);max-width:520px}.upload{right:calc(50% - 242px)}}
</style>
</head>
<body>
<div class="app">
<header class="top">
 <div class="top-row">
  <div class="left"><div class="hamb">☰</div><div class="logo">ATEEZ</div></div>
  <div class="icons"><span>♧</span><span onclick="go('notice')">▣</span><span onclick="go('shop')">♧</span><span class="profile" onclick="go('my')">◕</span></div>
 </div>
</header>

<main>
<section id="home" class="view active">
 <div class="hero-img"><h1>OUR ETERNAL<br>STAR ATINY</h1></div><div class="dots"><span></span><span></span></div>
 <div class="tabs"><button class="active">ALL</button><button>MEMBERSHIP</button><button>ALBUM</button><button>PROI</button><button>•••</button></div>
 <div class="section"><div class="section-title">추천 상품</div><div class="grid" id="homeProducts"></div></div>
</section>

<section id="talk" class="view">
 <div class="tabs"><button class="active">ATEEZ TALK</button><button>ARTIST</button><button>FAN</button></div>
 <div id="talkList"></div>
</section>

<section id="pop" class="view">
 <div class="section"><div class="section-title">POP</div></div><div id="chatList"></div>
</section>

<section id="contents" class="view">
 <div class="tabs"><button class="active">VIDEO</button><button>PHOTO</button><button>BEHIND</button></div>
 <div class="section" id="contentsList"></div>
</section>

<section id="community" class="view">
 <div class="tabs"><button class="active">NOTICE</button><button>FREE TALK<span style="color:var(--red)">•</span></button><button>EVENT</button><button>🛍</button></div>
 <div class="notice-fixed"><div class="fixed-head">✦ 고정된 포스트</div><div class="fixed-list" id="fixedNotice"></div></div>
 <div class="post-list" id="communityList"></div>
</section>

<section id="shop" class="view">
 <div class="hero-img"><h1>OUR ETERNAL<br>STAR ATINY</h1></div><div class="dots"><span></span><span></span></div>
 <div class="tabs"><button class="active">ALL</button><button>MEMBERSHIP</button><button>ALBUM</button><button>PROI</button><button>•••</button></div>
 <div class="section"><div class="grid" id="shopList"></div></div>
</section>

<section id="notice" class="view">
 <div class="tabs"><button class="active">NOTICE</button><button>UPDATE</button><button>FAQ</button></div>
 <div class="notice-fixed"><div class="fixed-head">📌 공지</div><div class="fixed-list" id="noticeList"></div></div>
</section>

<section id="my" class="view">
 <div class="my-box"><div class="my-title">MY</div><p style="color:#888;margin-top:6px">ATINY Membership Active</p></div>
 <div class="my-box"><div class="row">내 멤버십 <span>›</span></div><div class="row">주문 내역 <span>›</span></div><div class="row">내가 쓴 글 <span>›</span></div><div class="row">내 정보 관리 <span>›</span></div><div class="row" style="color:#ff4545">로그아웃 <span>›</span></div></div>
</section>
</main>

<button class="upload" onclick="uploadImage()">＋</button>
<nav class="bottom">
 <button class="nav active" data-page="home" onclick="go('home')"><span class="ico">⌂</span>Home</button>
 <button class="nav" data-page="talk" onclick="go('talk')"><span class="ico">▤</span>ATEEZ TALK</button>
 <button class="nav" data-page="pop" onclick="go('pop')"><span class="ico">POP</span>POP</button>
 <button class="nav" data-page="contents" onclick="go('contents')"><span class="ico">▶</span>Contents</button>
 <button class="nav" data-page="community" onclick="go('community')"><span class="ico">♟</span>Community</button>
 <button class="nav" data-page="notice" onclick="go('notice')"><span class="ico">!</span>Notice</button>
 <button class="nav" data-page="shop" onclick="go('shop')"><span class="ico">▾</span>Shop</button>
</nav>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyAA6mbdYfLrrgCJjN47PX91_mU7I53RiBs',authDomain:'site-c67b4.firebaseapp.com',projectId:'site-c67b4',storageBucket:'site-c67b4.firebasestorage.app',messagingSenderId:'744761377245',appId:'1:744761377245:web:3ddaee14f184716eeef634'};
const CLOUDINARY_CLOUD='dbljkloal';
const CLOUDINARY_PRESET='clowofficial';
const app=initializeApp(firebaseConfig);const db=getFirestore(app);
const products=[['💎','ATINY 7th MEMBERSHIP KIT','15,000원','멤버십 전용'],['▶','ATINY 7TH KIT VOD ONLY','7,000원',''],['💿','GOLDEN HOUR Pt.4 Album','18,000원',''],['⭐','ANITEEZ ADVENTURE MD','35,000원','']];
const notices=['ATEEZ(에이티즈) 편지 전달 주소 안내','ATEEZ(에이티즈) 오피셜 플랫폼 오픈 안내','ATEEZ(에이티즈) 오피셜 플랫폼 통합 규정 안내'];
const posts=['2024 ATEEZ WORLD TOUR [WILL TO POWER]','ATEEZ(에이티즈) THE WORLD EP.FIN 안내','82Valley ATINY ZONE 안내','ATEEZ X ANITEEZ ADVENTURE POP-UP'];
function productHTML(p){return `<div class="product"><div class="thumb">${p[0]}</div>${p[3]?`<div class="badge">${p[3]}</div>`:''}<div class="p-name">${p[1]}</div><div class="price">${p[2]}</div></div>`}
document.getElementById('homeProducts').innerHTML=products.slice(0,4).map(productHTML).join('');document.getElementById('shopList').innerHTML=products.map(productHTML).join('');
document.getElementById('fixedNotice').innerHTML=notices.map((n,i)=>`<div class="fixed-item"><span>${n} <b class="count">[${[48,173,26][i]}]</b></span><span class="time">3년 전</span></div>`).join('');
document.getElementById('noticeList').innerHTML=notices.concat(['멤버십 키트 배송 안내','개인정보 처리방침 변경 안내']).map((n,i)=>`<div class="fixed-item"><span>${n} <b class="count">[${[48,173,26,64,12][i]}]</b></span><span class="time">${i<3?'3년 전':'방금'}</span></div>`).join('');
document.getElementById('communityList').innerHTML=posts.map((p,i)=>`<div class="post"><div><div class="post-title">${p} <b class="count">[${[1320,14,53,64][i]}]</b></div><div class="post-meta">KQ엔터테인먼트 · 매니저 · 2년 전 · 반응 ${[1062,212,239,98][i]}</div><div class="post-comment">${['tiktok.com/@enh.yp Anthony cambodiaHi','izuki I got it from one store in Myeongdong','woosan_ing Crying in Indonesia','ATINY 기다렸어요'][i]}</div></div><div class="post-thumb">${['◐','▣','📄','🧩'][i]}</div></div>`).join('');
document.getElementById('talkList').innerHTML=['홍중','성화','윤호','여상','산','민기','우영','종호'].map((n,i)=>`<div class="talk-card"><div class="avatar">${['🎤','🌸','🌙','🔥','💎','🐥','⭐','🎸'][i]}</div><div class="talk-body"><div class="talk-name">${n} ✔</div><div class="talk-text">오늘도 와줘서 고마워요. 밥 잘 챙겨먹고 좋은 하루 보내기!</div></div></div>`).join('');
document.getElementById('chatList').innerHTML=['윤호','홍중','여상','종호','성화','산'].map((n,i)=>`<div class="chat"><div class="avatar">${['🌙','🎤','🔥','🎸','🌸','💎'][i]}</div><div class="chat-info"><div class="chat-name">${n}</div><div class="chat-msg">라이브 종료됨 · ${i? '2년 전':'4달 전'}</div></div><span class="dot"></span></div>`).join('');
document.getElementById('contentsList').innerHTML=['Golden Hour Behind','Dinero Production Behind','ATINY ZONE Special','Route Zero Making'].map((t,i)=>`<div class="content-card"><div class="content-title">${['🎬','🎵','🌟','▶'][i]} ${t}</div><div class="content-meta">YouTube · ${['08:21','04:00','10:00','06:35'][i]}</div></div>`).join('');
window.go=function(page){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(page).classList.add('active');document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===page));window.scrollTo(0,0)};
window.uploadImage=async function(){const input=document.createElement('input');input.type='file';input.accept='image/*';input.onchange=async()=>{const file=input.files[0];if(!file)return;const formData=new FormData();formData.append('file',file);formData.append('upload_preset',CLOUDINARY_PRESET);try{const res=await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`,{method:'POST',body:formData});const data=await res.json();alert('업로드 완료');console.log(data.secure_url)}catch(e){alert('업로드 실패');console.error(e)}};input.click()};
console.log('Firebase + Cloudinary connected',db);
</script>
</body>
</html>
