function renderProfilePreview(){document.getElementById('profile-img-preview').innerHTML=profileImageTemp?`<img src="${profileImageTemp}">`:'프로필 사진 없음'}window.pickProfileImage=async function(){const url=await uploadToCloudinary();if(url){profileImageTemp=url;renderProfilePreview();document.getElementById('modal-body-input').style.display='block';document.getElementById('modal-body-input').placeholder='멤버 프로필 사진은 아래 버튼에서 수정';document.getElementById('modal-body-input').value='';document.getElementById('modal-body-input').readOnly=true;document.getElementById('modal-price-input').style.display='none';setTimeout(()=>{const s=document.querySelector('#modal .sheet');if(s&&!document.getElementById('member-edit-open')){const b=document.createElement('button');b.id='member-edit-open';b.className='btn btn-light';b.style.width='100%';b.style.marginBottom='10px';b.textContent='멤버 프로필 사진 관리';b.onclick=()=>{closeModal();openMemberEdit()};s.insertBefore(b,document.getElementById('modal-save').parentElement)}})}}
window.logout=function(){if(confirm('로그아웃할까요?')){profile={nickname:'',name:'',birth:'',phone:'',photo:''};membership=null;orders=[];cart=[];save();render();alert('로그아웃되었습니다.');switchPage('home')}}
window.openMyDetail=function(title){let body='';if(title==='주문 내역'){document.getElementById('my-detail').innerHTML=`<button class="back" onclick="switchPage('my')">‹ MY</button><div class="detail-main"><div class="detail-title">주문 내역</div><div style="margin:14px 0"><button class="btn btn-danger" onclick="clearOrders()">주문내역 초기화</button></div><div id="order-list"></div></div>`;renderOrders();switchPage('my-detail');return}if(title==='내가 쓴 글')body=posts.map(p=>`- ${p.title}`).join('\\n')||'작성한 글이 없습니다.';else body='상세 화면입니다.';document.getElementById('my-detail').innerHTML=`<button class="back" onclick="switchPage('my')">‹ MY</button><div class="detail-main"><div class="detail-title">${title}</div><div class="detail-body">${body}</div></div>`;switchPage('my-detail')}
function renderOrders(){const el=document.getElementById('order-list');if(!el)return;el.innerHTML=orders.length?orders.map(o=>`<div class="order-row"><div class="order-thumb">${media(o.thumb||'🛍️')}</div><div class="order-main"><div class="order-title">${o.name}</div><div class="order-meta">${o.price} · 수량 ${o.qty||1} · ${o.date}</div></div></div>`).join(''):'<div class="meta">주문 내역이 없습니다.</div>'}window.clearOrders=function(){if(confirm('주문내역을 초기화할까요?')){orders=[];save();renderOrders()}}
window.openAddPost=function(){const active=document.querySelector('.view.active').id;modalMode=active==='page-notice'?'notice':active==='page-shop'?'product':'post';modalThumb='';openModal(modalMode==='notice'?'공지 추가':modalMode==='product'?'상품 추가':'게시글 추가','','','');if(modalMode==='product'){document.getElementById('modal-detail-input').style.display='block';document.getElementById('modal-detail-input').value=''}}
window.openAddNotice=function(){modalMode='notice';modalThumb='';openModal('공지 추가','','','')}
function openModal(title,a,b,c){document.getElementById('modal-title').textContent=title;document.getElementById('modal-save').textContent='저장';document.getElementById('modal-title-input').style.display='block';document.getElementById('modal-body-input').style.display='block';document.getElementById('modal-price-input').style.display='block';document.getElementById('thumb-area').style.display='block';document.getElementById('profile-img-area').style.display='none';document.getElementById('modal-detail-input').style.display='none';document.getElementById('modal-title-input').placeholder='제목';document.getElementById('modal-body-input').placeholder='내용';document.getElementById('modal-price-input').placeholder=modalMode==='product'||modalMode==='editProduct'?'가격':'메타 정보';document.getElementById('modal-title-input').value=a||'';document.getElementById('modal-body-input').value=b||'';document.getElementById('modal-price-input').value=c||'';renderModalThumb();document.getElementById('modal').classList.add('open')}
function renderModalThumb(){document.getElementById('modal-thumb-preview').innerHTML=modalThumb?media(modalThumb):'썸네일 없음'}window.pickModalThumb=async function(){const url=await uploadToCloudinary();if(url){modalThumb=url;renderModalThumb()}};window.closeModal=function(){document.getElementById('modal').classList.remove('open')}
window.saveModal=function(){const title=document.getElementById('modal-title-input').value.trim(),body=document.getElementById('modal-body-input').value.trim(),detailText=document.getElementById('modal-detail-input').value.trim(),meta=document.getElementById('modal-price-input').value.trim();if(modalMode==='profile'){profile.nickname=title;profile.photo=profileImageTemp;render();closeModal();return}if(modalMode==='join'){if(!title||!body||!meta)return alert('이름/생년월일/전화번호를 전부 입력해줘');if(!confirm(`최종 결제를 진행할까요?\\n\\n이름: ${title}\\n생년월일: ${body}\\n전화번호: ${meta}`))return;const now=new Date(),end=addYear(now);profile.name=title;profile.birth=body;profile.phone=meta;membership={name:title,birth:body,phone:meta,code:randomCode(),start:now.toISOString(),end:end.toISOString()};orders.unshift({id:Date.now(),thumb:'💎',name:'ATINY MEMBERSHIP (단건 결제)',price:'20,000원',qty:1,date:fmt(now),status:'결제 완료'});render();closeModal();alert('결제가 완료되었습니다. 멤버십 카드가 생성되었습니다.');openMembership();return}if(!title)return alert('제목을 입력해줘');if(modalMode==='notice'){notices.unshift({id:Date.now(),title,body:body||'상세 내용입니다.',meta:meta||'KQ엔터테인먼트 · 방금',thumb:modalThumb||'📢'});addAlarm('공지',title,modalThumb||'📢');switchPage('notice')}else if(modalMode==='editNotice'){const n=notices.find(x=>x.id===editingNoticeId);n.title=title;n.body=body;n.meta=meta||n.meta;n.thumb=modalThumb||n.thumb;openNotice(n.id)}else if(modalMode==='product'){products.unshift({id:Date.now(),thumb:modalThumb||'🛍️',name:title,price:meta||'0원',detail:body||'상품 상세페이지입니다.',detailText:detailText||'',detailImg:''});switchPage('shop')}else if(modalMode==='editProduct'){const p=products.find(x=>x.id===editingProductId);p.name=title;p.detail=body;p.price=meta;p.thumb=modalThumb||p.thumb;p.detailText=detailText;openProduct(p.id)}else if(modalMode==='editPost'){const p=posts.find(x=>x.id===editingPostId);p.title=title;p.body=body||meta;p.thumb=modalThumb||p.thumb;openPost(p.id)}else{const active=document.querySelector('.view.active').id,type=active==='page-contents'?'content':'talk';const m=type==='talk'?(selectedTalkMember?talkMembers.find(x=>x.id===selectedTalkMember):talkMembers[0]):null;posts.unshift({id:Date.now(),type,category:type==='content'?'video':undefined,memberId:m?.id,memberName:m?.name,title,body:body||meta||'새 게시글입니다.',thumb:modalThumb||'＋',duration:type==='content'?'YouTube':undefined,likes:0,comments:0});addAlarm(type==='content'?'콘텐츠':'게시글',title,modalThumb||'＋');switchPage(type==='content'?'contents':'talk')}render();closeModal()}

window.openMemberEdit=function(){
 document.getElementById('member-edit-page').innerHTML=`<button class="back" onclick="switchPage('my')">‹ MY</button><div class="detail-main"><div class="detail-title">멤버 프로필 사진 관리</div><div class="member-edit-list">${talkMembers.map(m=>`<div class="member-edit-row"><div class="member-edit-left"><div class="member-edit-photo">${media(m.photo)}</div><span>${m.name}</span></div><button onclick="changeMemberPhoto('${m.id}')">사진 변경</button></div>`).join('')}</div></div>`;
 switchPage('member-edit');
}
window.changeMemberPhoto=async function(id){
 const url=await uploadToCloudinary();if(!url)return;
 const m=talkMembers.find(x=>x.id===id);if(m)m.photo=url;
 save();openMemberEdit();renderMemberStrip();renderTalkFeed();
}

async function uploadToCloudinary(){return new Promise(resolve=>{const input=document.createElement('input');input.type='file';input.accept='image/*';input.onchange=async()=>{const file=input.files[0];if(!file)return resolve('');const fd=new FormData();fd.append('file',file);fd.append('upload_preset',CLOUDINARY_PRESET);try{const res=await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`,{method:'POST',body:fd});const data=await res.json();resolve(data.secure_url||'')}catch(e){alert('업로드 실패');resolve('')}};input.click()})}
render();console.log('Firebase + Cloudinary Connected',db);
