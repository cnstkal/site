<!DOCTYPE html><html lang='ko'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0,viewport-fit=cover'><title>TOKTOQ</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Pretendard',sans-serif;background:#111;color:#f7f7f7;letter-spacing:-.04em}#app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:84px;background:#141414}.top{position:sticky;top:0;z-index:20;background:#141414;padding:24px 22px 14px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:34px;line-height:1;font-weight:780;text-decoration:underline;letter-spacing:-.07em}.setting{width:34px;height:34px;background:none;border:0;color:#fff}.setting:before{content:'⚙';font-size:31px}.wrap{padding:0 20px}.artistTitle{font-size:23px;font-weight:620;margin:18px 0 18px}.artistCard{height:66px;background:#292929;border:0;border-radius:17px;display:flex;align-items:center;gap:14px;padding:10px 14px;margin-bottom:12px;width:100%;color:#fff;text-align:left}.artistLogo{width:46px;height:46px;border-radius:10px;background:#dfe0ee;object-fit:cover}.artistName{font-size:18px;font-weight:520;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.chev{font-size:30px;color:#707070;font-weight:300}.artistHome{background:#fff;color:#111;min-height:100vh}.whiteTop{position:sticky;top:0;z-index:20;height:70px;background:#fff;display:flex;align-items:center;gap:18px;padding:14px 20px;border-bottom:1px solid #eee}.back{font-size:28px;border:0;background:none}.brand{font-weight:850;font-style:italic;font-size:22px;letter-spacing:-.06em}.hero{position:relative;height:420px;overflow:hidden}.hero img{width:100%;height:100%;object-fit:cover}.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(255,255,255,.1) 0%,rgba(255,255,255,.25) 42%,rgba(24,25,39,.72) 100%)}.heroTxt{position:absolute;left:0;right:0;bottom:42px;z-index:1;text-align:center;color:#fff}.heroTxt h1{font-size:24px;font-weight:650;margin:0 0 18px}.join{background:#fff;color:#111;border:0;border-radius:10px;padding:13px 22px;font-size:19px;font-weight:720}.storyRow{display:flex;gap:14px;overflow:auto;padding:18px 20px}.storyRow::-webkit-scrollbar,.scroll::-webkit-scrollbar{display:none}.story{min-width:118px;height:118px;border-radius:11px;overflow:hidden;background:#ddd}.story img{width:100%;height:100%;object-fit:cover}.homeSection{padding:20px}.homeSection h2{font-size:25px;font-weight:650;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.post{border:1px solid #e1e1e1;border-radius:8px;overflow:hidden;color:#111;text-decoration:none;background:#fff}.postImg{aspect-ratio:1/1;background:#eee}.postImg img{width:100%;height:100%;object-fit:cover}.postBody{padding:12px}.postBody b{font-size:16px;font-weight:550}.postBody p{font-size:13px;color:#777;margin:6px 0 0}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:50;width:100%;max-width:520px;height:78px;background:#f7f7f7;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(6,1fr)}.nav button{border:0;background:none;color:#777;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:650}.nav button.on{color:#111}.ico{width:24px;height:24px;position:relative;display:block}.home:before{content:'';position:absolute;left:4px;top:8px;width:16px;height:13px;border:3px solid currentColor;border-top:0;border-radius:2px}.home:after{content:'';position:absolute;left:4px;top:3px;width:17px;height:17px;border-left:3px solid currentColor;border-top:3px solid currentColor;transform:rotate(45deg);border-radius:2px}.list:before{content:'';position:absolute;inset:3px 6px;border:3px solid currentColor;border-radius:3px}.list:after{content:'';position:absolute;left:11px;top:8px;width:8px;height:3px;background:currentColor;box-shadow:0 6px 0 currentColor}.popico{font-size:17px;font-weight:900;line-height:24px}.play:before{content:'';position:absolute;left:7px;top:4px;border-left:16px solid currentColor;border-top:9px solid transparent;border-bottom:9px solid transparent}.people:before,.people:after{content:'';position:absolute;background:currentColor;border-radius:50%}.people:before{width:12px;height:12px;left:3px;top:2px;box-shadow:11px 0 0 currentColor}.people:after{width:16px;height:9px;left:0;top:15px;border-radius:12px 12px 4px 4px;box-shadow:13px 0 0 currentColor}.shop:before{content:'';position:absolute;left:4px;top:7px;width:17px;height:15px;border:3px solid currentColor;border-radius:3px}.shop:after{content:'';position:absolute;left:9px;top:1px;width:8px;height:9px;border:3px solid currentColor;border-bottom:0;border-radius:8px 8px 0 0}.fab{position:fixed;right:18px;bottom:98px;z-index:70;width:52px;height:52px;border-radius:50%;border:0;background:#fff;color:#111;font-size:24px;box-shadow:0 10px 30px rgba(0,0,0,.25)}.admin{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:100}.admin.on{display:block}.panel{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:auto;background:#fff;color:#111;border-radius:24px 24px 0 0;padding:18px;max-height:88vh;overflow:auto}.panel h2{margin:0 0 14px;font-size:24px}.panel input{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;margin:0 0 9px}.save{width:100%;border:0;background:#111;color:#fff;border-radius:12px;padding:13px;font-weight:800;margin-bottom:10px}.item{border:1px solid #ddd;border-radius:14px;padding:12px;margin:10px 0}.item button{border:0;background:#111;color:#fff;border-radius:9px;padding:8px 12px;margin-top:8px}.sync{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:10px 14px;border-radius:999px;font-size:12px;display:none;z-index:200}.sync.on{display:block}</style></head><body><div class='sync' id='sync'>저장됨</div><div id='app'></div><button class='fab' onclick='openAdmin()'>⚙</button><div class='admin' id='admin'><div class='panel'><button onclick='closeAdmin()' style='float:right;border:0;background:none;font-size:30px'>×</button><h2>관리자</h2><input id='nav0' placeholder='Home 이름'><input id='nav1' placeholder='ATEEZ TALK 이름'><input id='nav2' placeholder='POP 이름'><input id='nav3' placeholder='Contents 이름'><input id='nav4' placeholder='Community 이름'><input id='nav5' placeholder='Shop 이름'><button class='save' onclick='saveNav()'>하단 이름 저장</button><hr><input id='postTitle' placeholder='게시글 제목'><input id='postDesc' placeholder='게시글 설명'><input type='file' id='postFile' accept='image/*'><button class='save' onclick='addContent()'>게시글 추가</button><div id='editList'></div></div></div><script type='module'>import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';import{getFirestore,doc,setDoc,getDoc,onSnapshot}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';const firebaseConfig={apiKey:'AIzaSyAA6mbdYfLrrgCJjN47PX91_mU7I53RiBs',authDomain:'site-c67b4.firebaseapp.com',projectId:'site-c67b4',storageBucket:'site-c67b4.firebasestorage.app',messagingSenderId:'744761377245',appId:'1:744761377245:web:3ddaee14f184716eeef634'};const CLOUDINARY_CLOUD='dbljkloal';const CLOUDINARY_PRESET='clowofficial';const appFB=initializeApp(firebaseConfig);const db=getFirestore(appFB);const ref=doc(db,'site','main');const defaults={nav:['Home','ATEEZ TALK','POP','Contents','Community','Shop'],artists:[{name:'ATEEZ(에이티즈) OFFICIAL PLATFORM',image:'https://images.unsplash.com/photo-1511379938547-c1f69419868d?auto=format&fit=crop&w=500&q=80'},{name:'xikers(싸이커스) OFFICIAL PLATFORM',image:'https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=500&q=80'}],contents:[{title:'xikers(싸이커스) - ROUTE ZERO',desc:'RELEASE 2026. 05. 19. 6PM (KST)',image:'https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?auto=format&fit=crop&w=900&q=80'},{title:'[👻] YOUR FRIENDLY GHOST',desc:'OUR ETERNAL STARS',image:'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=900&q=80'}]};let state=defaults;let view='main';let artistIndex=0;function toast(t){sync.textContent=t;sync.classList.add('on');setTimeout(()=>sync.classList.remove('on'),1200)}async function upload(file){const fd=new FormData();fd.append('file',file);fd.append('upload_preset',CLOUDINARY_PRESET);const r=await fetch('https://api.cloudinary.com/v1_1/'+CLOUDINARY_CLOUD+'/image/upload',{method:'POST',body:fd});const j=await r.json();return j.secure_url}async function save(){await setDoc(ref,state);toast('저장 완료')}function img(x){return x.image||x.img||''}function nav(){return '<div class="nav"><button class="on" onclick="goMain()"><i class="ico home"></i><span>'+state.nav[0]+'</span></button><button><i class="ico list"></i><span>'+state.nav[1]+'</span></button><button><i class="ico popico">POP</i><span>'+state.nav[2]+'</span></button><button><i class="ico play"></i><span>'+state.nav[3]+'</span></button><button><i class="ico people"></i><span>'+state.nav[4]+'</span></button><button><i class="ico shop"></i><span>'+state.nav[5]+'</span></button></div>'}function render(){if(view==='artist')return renderArtist();app.innerHTML='<div class="top"><div class="logo">TOKTOQ</div><button class="setting" onclick="openAdmin()"></button></div><div class="wrap"><div class="artistTitle">아티스트</div>'+state.artists.map((a,i)=>'<button class="artistCard" onclick="openArtist('+i+')"><img class="artistLogo" src="'+img(a)+'"><div class="artistName">'+a.name+'</div><div class="chev">›</div></button>').join('')+'</div>'+nav();editList.innerHTML=state.contents.map((x,i)=>'<div class="item"><b>'+x.title+'</b><br><button onclick="delContent('+i+')">삭제</button></div>').join('')}function renderArtist(){const a=state.artists[artistIndex]||state.artists[0];app.innerHTML='<div class="artistHome"><div class="whiteTop"><button class="back" onclick="goMain()">‹</button><div class="brand">'+(a.name||'ARTIST').split('(')[0]+'</div><span style="margin-left:auto">♧ □ ♧</span></div><section class="hero"><img src="'+img(a)+'"><div class="heroTxt"><h1>'+a.name+'</h1><button class="join">멤버십 가입</button></div></section><div class="storyRow">'+state.contents.map(x=>'<div class="story"><img src="'+img(x)+'"></div>').join('')+'</div><section class="homeSection"><h2>X '+(a.name||'ARTIST').split(' ')[0]+' Official</h2><div class="grid">'+state.contents.map((x,i)=>'<a class="post" href="#post-'+i+'" onclick="openPost('+i+')"><div class="postImg"><img src="'+img(x)+'"></div><div class="postBody"><b>'+x.title+'</b><p>'+x.desc+'</p></div></a>').join('')+'</div></section></div>'+nav()}window.openArtist=i=>{artistIndex=i;view='artist';render();scrollTo(0,0)};window.goMain=()=>{view='main';render();scrollTo(0,0)};window.openPost=i=>alert(state.contents[i].title+'\n\n'+(state.contents[i].desc||''));window.openAdmin=()=>{admin.classList.add('on');state.nav.forEach((v,i)=>{let el=document.getElementById('nav'+i);if(el)el.value=v})};window.closeAdmin=()=>admin.classList.remove('on');window.saveNav=async()=>{state.nav=[nav0.value,nav1.value,nav2.value,nav3.value,nav4.value,nav5.value];await save();render()};window.addContent=async()=>{toast('업로드중...');let image='https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?auto=format&fit=crop&w=900&q=80';if(postFile.files[0])image=await upload(postFile.files[0]);state.contents.unshift({title:postTitle.value||'NEW CONTENT',desc:postDesc.value||'',image});await save();render();postTitle.value='';postDesc.value='';postFile.value=''};window.delContent=async i=>{state.contents.splice(i,1);await save();render()};async function init(){const snap=await getDoc(ref);if(snap.exists()){const got=snap.data();state={...defaults,...got,nav:got.nav||defaults.nav,artists:got.artists||defaults.artists,contents:got.contents||got.posts||defaults.contents}}else await save();render();onSnapshot(ref,s=>{if(s.exists()){const got=s.data();state={...defaults,...got,nav:got.nav||defaults.nav,artists:got.artists||defaults.artists,contents:got.contents||got.posts||defaults.contents};render()}})}init();</script></body></html>
