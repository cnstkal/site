<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ATEEZ Official Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
--bg:#ffffff;
--card:#f5f5f7;
--line:#e5e5e5;
--text:#111111;
--sub:#777777;
--accent:#111111;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
font-family:'Pretendard',sans-serif;
background:var(--bg);
color:var(--text);
}
header{
position:sticky;
top:0;
z-index:100;
background:rgba(255,255,255,.92);
backdrop-filter:blur(14px);
border-bottom:1px solid var(--line);
padding:16px 20px;
display:flex;
justify-content:space-between;
align-items:center;
}
.logo{
font-size:1.2rem;
font-weight:800;
letter-spacing:-0.03em;
}
.hero{
padding:20px;
}
.hero-card{
background:linear-gradient(135deg,#ffffff,#f2f2f2);
border:1px solid var(--line);
border-radius:28px;
padding:28px 22px;
min-height:220px;
display:flex;
flex-direction:column;
justify-content:flex-end;
}
.hero-card h1{
font-size:2.2rem;
line-height:1;
letter-spacing:-0.05em;
margin-bottom:10px;
}
.hero-card p{
font-size:.92rem;
color:var(--sub);
margin-bottom:18px;
}
.hero-btn{
height:48px;
border:none;
border-radius:999px;
background:#111;
color:#fff;
font-weight:700;
}
.section{
padding:0 20px 28px;
}
.section-title{
font-size:1rem;
font-weight:800;
margin-bottom:14px;
letter-spacing:-0.03em;
}
.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:14px;
}
.card{
background:var(--card);
border-radius:22px;
overflow:hidden;
border:1px solid #ececec;
}
.thumb{
aspect-ratio:1/1;
background:linear-gradient(135deg,#ececec,#dcdcdc);
display:flex;
align-items:center;
justify-content:center;
font-size:2rem;
}
.info{
padding:12px;
}
.title{
font-size:.9rem;
font-weight:700;
line-height:1.35;
margin-bottom:4px;
}
.meta{
font-size:.75rem;
color:var(--sub);
}
.bottom-nav{
position:fixed;
bottom:0;
left:0;
width:100%;
height:74px;
background:rgba(255,255,255,.95);
backdrop-filter:blur(16px);
border-top:1px solid var(--line);
display:flex;
justify-content:space-around;
align-items:center;
padding-bottom:env(safe-area-inset-bottom);
}
.nav-item{
display:flex;
flex-direction:column;
align-items:center;
gap:4px;
font-size:.68rem;
color:var(--sub);
font-weight:600;
}
.nav-item.active{color:#111;}
.upload-btn{
position:fixed;
right:20px;
bottom:96px;
width:58px;
height:58px;
border-radius:50%;
border:none;
background:#111;
color:#fff;
font-size:1.8rem;
box-shadow:0 10px 30px rgba(0,0,0,.15);
}
@media(min-width:900px){
body{
background:#efefef;
}
.app{
max-width:500px;
margin:0 auto;
background:#fff;
min-height:100vh;
position:relative;
box-shadow:0 0 40px rgba(0,0,0,.06);
}
}
</style>
</head>
<body>
<div class="app">
<header>
<div class="logo">ATEEZ</div>
<div>🔔</div>
</header>
<section class="hero">
<div class="hero-card">
<h1>GOLDEN<br>HOUR</h1>
<p>ATEEZ Official Platform · White Edition</p>
<button class="hero-btn">멤버십 가입하기</button>
</div>
</section>
<section class="section">
<div class="section-title">LATEST CONTENTS</div>
<div class="grid">
<div class="card">
<div class="thumb">🎬</div>
<div class="info">
<div class="title">Golden Hour Behind</div>
<div class="meta">YouTube · 08:21</div>
</div>
</div>
<div class="card">
<div class="thumb">📸</div>
<div class="info">
<div class="title">ATINY Special Photos</div>
<div class="meta">Gallery Update</div>
</div>
</div>
<div class="card">
<div class="thumb">💿</div>
<div class="info">
<div class="title">NEW ALBUM RELEASE</div>
<div class="meta">Shop</div>
</div>
</div>
<div class="card">
<div class="thumb">🌟</div>
<div class="info">
<div class="title">POP Live Message</div>
<div class="meta">POP</div>
</div>
</div>
</div>
</section>
<button class="upload-btn" onclick="uploadImage()">＋</button>
<nav class="bottom-nav">
<div class="nav-item active">🏠<span>HOME</span></div>
<div class="nav-item">💬<span>TALK</span></div>
<div class="nav-item">▶️<span>CONTENTS</span></div>
<div class="nav-item">🛍️<span>SHOP</span></div>
<div class="nav-item">👤<span>MY</span></div>
</nav>
</div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: 'AIzaSyAA6mbdYfLrrgCJjN47PX91_mU7I53RiBs',
  authDomain: 'site-c67b4.firebaseapp.com',
  projectId: 'site-c67b4',
  storageBucket: 'site-c67b4.firebasestorage.app',
  messagingSenderId: '744761377245',
  appId: '1:744761377245:web:3ddaee14f184716eeef634'
};

const CLOUDINARY_CLOUD = 'dbljkloal';
const CLOUDINARY_PRESET = 'clowofficial';

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.uploadImage = async function(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';

  input.onchange = async () => {
    const file = input.files[0];
    if(!file) return;

    const formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', CLOUDINARY_PRESET);

    try{
      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`, {
        method:'POST',
        body:formData
      });

      const data = await res.json();
      alert('업로드 완료!');
      console.log(data.secure_url);
    }catch(e){
      console.error(e);
      alert('업로드 실패');
    }
  }

  input.click();
}

console.log('Firebase + Cloudinary Connected', db);
</script>
</body>
</html>
