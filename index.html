<!DOCTYPE html><html lang='ko'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0,viewport-fit=cover'><title>TOKTOQ</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#fff}#app{max-width:520px;margin:auto;padding-bottom:90px}.top{position:sticky;top:0;background:#fff;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;z-index:10}.logo{font-weight:900;font-size:24px;font-style:italic}.hero{height:520px;position:relative;overflow:hidden}.hero img{width:100%;height:100%;object-fit:cover}.overlay{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,rgba(0,0,0,.8))}.heroTxt{position:absolute;bottom:50px;left:0;right:0;color:#fff;text-align:center;padding:20px}.heroTxt h1{font-size:42px;margin:0 0 18px;font-weight:900}.join{background:#fff;color:#111;padding:16px 26px;border-radius:12px;font-size:22px;font-weight:800;border:0}.section{padding:28px 20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{border-radius:18px;overflow:hidden;border:1px solid #eee;background:#fff}.thumb{aspect-ratio:1/1;background:#ddd}.thumb img{width:100%;height:100%;object-fit:cover}.body{padding:14px}.body b{font-size:18px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;height:82px;background:#fff;border-top:1px solid #eee;display:grid;grid-template-columns:repeat(5,1fr)}.nav button{border:0;background:none;font-size:13px;color:#777}.nav .on{color:#111;font-weight:800}.fab{position:fixed;right:18px;bottom:100px;width:58px;height:58px;border-radius:50%;background:#111;color:#fff;border:0;font-size:24px}.admin{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none}.admin.on{display:block}.panel{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:auto;background:#fff;border-radius:24px 24px 0 0;padding:20px;max-height:85vh;overflow:auto}.panel input,.panel textarea{width:100%;padding:14px;border-radius:12px;border:1px solid #ddd;margin-bottom:10px;box-sizing:border-box}.save{width:100%;padding:14px;background:#111;color:#fff;border-radius:12px;border:0;font-weight:800}.item{padding:12px;border:1px solid #ddd;border-radius:12px;margin-top:10px}.item button{margin-top:8px}.sync{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 14px;border-radius:999px;font-size:12px;display:none}.sync.on{display:block}</style></head><body><div class='sync' id='sync'>동기화중...</div><div id='app'></div><button class='fab' onclick='openAdmin()'>⚙</button><div class='admin' id='admin'><div class='panel'><button onclick='closeAdmin()' style='float:right;border:0;background:none;font-size:30px'>×</button><h2>관리자</h2><input id='titleInput' placeholder='콘텐츠 제목'><input type='file' id='fileInput' accept='image/*'><textarea id='descInput' placeholder='설명'></textarea><button class='save' onclick='addContent()'>콘텐츠 추가</button><div id='editList'></div></div></div><script type='module'>import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';import{getFirestore,doc,setDoc,getDoc,onSnapshot}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';const firebaseConfig={apiKey:'AIzaSyAA6mbdYfLrrgCJjN47PX91_mU7I53RiBs',authDomain:'site-c67b4.firebaseapp.com',projectId:'site-c67b4',storageBucket:'site-c67b4.firebasestorage.app',messagingSenderId:'744761377245',appId:'1:744761377245:web:3ddaee14f184716eeef634'};const CLOUDINARY_CLOUD='dbljkloal';const CLOUDINARY_PRESET='clowofficial';const appFB=initializeApp(firebaseConfig);const db=getFirestore(appFB);const ref=doc(db,'site','main');const defaults={hero:{title:'My GHOSTEEZ BESTIES',button:'멤버십 가입',image:'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=1200&q=80'},contents:[{title:'ATEEZ Production Behind',desc:'NEW CONTENT',image:'https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?auto=format&fit=crop&w=1200&q=80'}]};let state=defaults;let page='home';const $=s=>document.querySelector(s);function toast(t){sync.textContent=t;sync.classList.add('on');setTimeout(()=>sync.classList.remove('on'),1200)}async function upload(file){const fd=new FormData();fd.append('file',file);fd.append('upload_preset',CLOUDINARY_PRESET);const r=await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`,{method:'POST',body:fd});const j=await r.json();return j.secure_url}async function save(){await setDoc(ref,state);toast('저장 완료')}function render(){app.innerHTML=`<div class='top'><div class='logo'>ATEEZ</div><div>⌂ ◇ ⊔</div></div><section class='hero'><img src='${state.hero.image}'><div class='overlay'></div><div class='heroTxt'><h1>${state.hero.title}</h1><button class='join'>${state.hero.button}</button></div></section><section class='section'><h2>CONTENTS</h2><div class='grid'>${state.contents.map((x,i)=>`<div class='card'><div class='thumb'><img src='${x.image}'></div><div class='body'><b>${x.title}</b><p>${x.desc}</p></div></div>`).join('')}</div></section><div class='nav'><button class='on'>Home</button><button>TALK</button><button>POP</button><button>Community</button><button>Shop</button></div>`;editList.innerHTML=state.contents.map((x,i)=>`<div class='item'><b>${x.title}</b><br><button onclick='delContent(${i})'>삭제</button></div>`).join('')}window.openAdmin=()=>admin.classList.add('on');window.closeAdmin=()=>admin.classList.remove('on');window.addContent=async()=>{toast('업로드중...');let image='https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?auto=format&fit=crop&w=1200&q=80';if(fileInput.files[0])image=await upload(fileInput.files[0]);state.contents.unshift({title:titleInput.value||'NEW CONTENT',desc:descInput.value||'',image});await save();render();titleInput.value='';descInput.value='';fileInput.value=''};window.delContent=async i=>{state.contents.splice(i,1);await save();render()};async function init(){const snap=await getDoc(ref);if(snap.exists())state=snap.data();else await save();render();onSnapshot(ref,s=>{if(s.exists()){state=s.data();render()}})}init();</script></body></html>
