<!DOCTYPE html><html lang='ko'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0,viewport-fit=cover'><title>TOKTOQ</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Pretendard',sans-serif;background:#111;color:#f7f7f7;letter-spacing:-.04em}#app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:90px;background:#141414}.top{position:sticky;top:0;z-index:20;background:#141414;padding:34px 22px 18px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:42px;line-height:1;font-weight:800;text-decoration:underline;letter-spacing:-.07em}.setting{width:42px;height:42px;background:none;border:0;color:#fff;position:relative}.setting:before{content:'⚙';font-size:39px;line-height:1}.wrap{padding:0 20px}.artistTitle{font-size:28px;font-weight:650;margin:28px 0 24px;color:#f1f1f1}.artistCard{height:80px;background:#292929;border-radius:18px;display:flex;align-items:center;gap:16px;padding:12px 16px;margin-bottom:14px}.artistLogo{width:54px;height:54px;border-radius:10px;background:#dfe0ee;object-fit:cover}.artistName{font-size:20px;font-weight:550;color:#f3f3f3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.chev{font-size:34px;color:#727272;font-weight:300}.line{height:1px;background:#242424;margin:26px 0 22px}.section{padding:0 20px 22px}.section h2{font-size:27px;font-weight:650;letter-spacing:-.05em;margin:0 0 22px;color:#f4f4f4}.scroll{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px}.scroll::-webkit-scrollbar{display:none}.post{min-width:82%;scroll-snap-align:start;background:#262626;border-radius:22px;overflow:hidden;color:#fff;text-decoration:none}.postImg{height:185px;background:#333}.postImg img{width:100%;height:100%;object-fit:cover}.postBody{padding:18px}.postBody b{display:block;font-size:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.postBody p{margin:12px 0 0;color:#aaa;font-size:17px;font-weight:400}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:50;width:100%;max-width:520px;height:82px;background:#f7f7f7;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(6,1fr)}.nav button{border:0;background:none;color:#777;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:12px;font-weight:650}.nav button.on{color:#111}.ico{width:26px;height:26px;position:relative;display:block}.home:before{content:'';position:absolute;left:4px;top:8px;width:18px;height:14px;border:3px solid currentColor;border-top:0;border-radius:2px}.home:after{content:'';position:absolute;left:3px;top:2px;width:20px;height:20px;border-left:3px solid currentColor;border-top:3px solid currentColor;transform:rotate(45deg);border-radius:2px}.list:before{content:'';position:absolute;inset:3px 5px;border:3px solid currentColor;border-radius:3px}.list:after{content:'';position:absolute;left:10px;top:8px;width:10px;height:3px;background:currentColor;box-shadow:0 6px 0 currentColor}.popico{font-size:18px;font-weight:900;line-height:26px}.play:before{content:'';position:absolute;left:7px;top:4px;border-left:17px solid currentColor;border-top:10px solid transparent;border-bottom:10px solid transparent}.people:before,.people:after{content:'';position:absolute;background:currentColor;border-radius:50%}.people:before{width:13px;height:13px;left:3px;top:2px;box-shadow:12px 0 0 currentColor}.people:after{width:17px;height:10px;left:0;top:16px;border-radius:12px 12px 4px 4px;box-shadow:14px 0 0 currentColor}.shop:before{content:'';position:absolute;left:4px;top:7px;width:18px;height:16px;border:3px solid currentColor;border-radius:3px}.shop:after{content:'';position:absolute;left:9px;top:1px;width:8px;height:9px;border:3px solid currentColor;border-bottom:0;border-radius:8px 8px 0 0}.fab{position:fixed;right:18px;bottom:105px;z-index:70;width:58px;height:58px;border-radius:50%;border:0;background:#fff;color:#111;font-size:28px;box-shadow:0 10px 30px rgba(0,0,0,.25)}.admin{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:100}.admin.on{display:block}.panel{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:auto;background:#fff;color:#111;border-radius:26px 26px 0 0;padding:20px;max-height:88vh;overflow:auto}.panel h2{margin:0 0 14px;font-size:26px}.panel input,.panel textarea{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;margin:0 0 10px}.save{width:100%;border:0;background:#111;color:#fff;border-radius:12px;padding:14px;font-weight:800;margin-bottom:12px}.item{border:1px solid #ddd;border-radius:14px;padding:12px;margin:10px 0}.item button{border:0;background:#111;color:#fff;border-radius:9px;padding:8px 12px;margin-top:8px}.sync{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:10px 14px;border-radius:999px;font-size:12px;display:none;z-index:200}.sync.on{display:block}</style></head><body><div class='sync' id='sync'>저장됨</div><div id='app'></div><button class='fab' onclick='openAdmin()'>⚙</button><div class='admin' id='admin'><div class='panel'><button onclick='closeAdmin()' style='float:right;border:0;background:none;font-size:30px'>×</button><h2>관리자</h2><input id='nav0' placeholder='Home 이름'><input id='nav1' placeholder='ATEEZ TALK 이름'><input id='nav2' placeholder='POP 이름'><input id='nav3' placeholder='Contents 이름'><input id='nav4' placeholder='Community 이름'><input id='nav5' placeholder='Shop 이름'><button class='save' onclick='saveNav()'>하단 이름 저장</button><hr><input id='postTitle' placeholder='게시글 제목'><input id='postDesc' placeholder='게시글 설명'><input type='file' id='postFile' accept='image/*'><button class='save' onclick='addContent()'>게시글 추가</button><div id='editList'></div></div></div><script type='module'>import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';import{getFirestore,doc,setDoc,getDoc,onSnapshot}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';const firebaseConfig={apiKey:'AIzaSyAA6mbdYfLrrgCJjN47PX91_mU7I53RiBs',authDomain:'site-c67b4.firebaseapp.com',projectId:'site-c67b4',storageBucket:'site-c67b4.firebasestorage.app',messagingSenderId:'744761377245',appId:'1:744761377245:web:3ddaee14f184716eeef634'};const CLOUDINARY_CLOUD='dbljkloal';const CLOUDINARY_PRESET='clowofficial';const appFB=initializeApp(firebaseConfig);const db=getFirestore(appFB);const ref=doc(db,'site','main');const defaults={nav:['Home','ATEEZ TALK','POP','Contents','Community','Shop'],artists:[{name:'ATEEZ(에이티즈) OFFICIAL PLATFORM',image:'https://images.unsplash.com/photo-1511379938547-c1f69419868d?auto=format&fit=crop&w=500&q=80'},{name:'xikers(싸이커스) OFFICIAL PLATFORM',image:'https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=500&q=80'}],contents:[{title:'xikers(싸이커스) - ROUTE ZERO',desc:'RELEASE 2026. 05. 19. 6PM (KST)',image:'https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?auto=format&fit=crop&w=900&q=80'},{title:'[👻] YOUR FRIENDLY GHOST',desc:'OUR ETERNAL STARS',image:'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=900&q=80'}]};let state=defaults;const $=s=>document.querySelector(s);function toast(t){sync.textContent=t;sync.classList.add('on');setTimeout(()=>sync.classList.remove('on'),1200)}async function upload(file){const fd=new FormData();fd.append('file',file);fd.append('upload_preset',CLOUDINARY_PRESET);const r=await fetch('https://api.cloudinary.com/v1_1/'+CLOUDINARY_CLOUD+'/image/upload',{method:'POST',body:fd});const j=await r.json();return j.secure_url}async function save(){await setDoc(ref,state);toast('저장 완료')}function img(x){return x.image||x.img||''}function render(){app.innerHTML='<div class="top"><div class="logo">TOKTOQ</div><button class="setting" onclick="openAdmin()"></button></div><div class="wrap"><div class="artistTitle">아티스트</div>'+state.artists.map(a=>'<div class="artistCard"><img class="artistLogo" src="'+img(a)+'"><div class="artistName">'+a.name+'</div><div class="chev">›</div></div>').join('')+'<div class="line"></div></div><section class="section"><h2>ROUTE ZERO : The ORA</h2><div class="scroll">'+state.contents.map((x,i)=>'<a class="post" href="#post-'+i+'" onclick="openPost('+i+')"><div class="postImg"><img src="'+img(x)+'"></div><div class="postBody"><b>'+x.title+'</b><p>'+x.desc+'</p></div></a>').join('')+'</div></section><section class="section"><h2>OUR ETERNAL STARS</h2><div class="scroll">'+state.contents.map((x,i)=>'<a class="post" href="#post-'+i+'" onclick="openPost('+i+')"><div class="postImg"><img src="'+img(x)+'"></div><div class="postBody"><b>'+x.title+'</b><p>'+x.desc+'</p></div></a>').join('')+'</div></section><div class="nav"><button class="on"><i class="ico home"></i><span>'+state.nav[0]+'</span></button><button><i class="ico list"></i><span>'+state.nav[1]+'</span></button><button><i class="ico popico">POP</i><span>'+state.nav[2]+'</span></button><button><i class="ico play"></i><span>'+state.nav[3]+'</span></button><button><i class="ico people"></i><span>'+state.nav[4]+'</span></button><button><i class="ico shop"></i><span>'+state.nav[5]+'</span></button></div>';editList.innerHTML=state.contents.map((x,i)=>'<div class="item"><b>'+x.title+'</b><br><button onclick="delContent('+i+')">삭제</button></div>').join('')}window.openPost=i=>{alert(state.contents[i].title+'\n\n'+(state.contents[i].desc||''))};window.openAdmin=()=>{admin.classList.add('on');state.nav.forEach((v,i)=>{let el=document.getElementById('nav'+i);if(el)el.value=v})};window.closeAdmin=()=>admin.classList.remove('on');window.saveNav=async()=>{state.nav=[nav0.value,nav1.value,nav2.value,nav3.value,nav4.value,nav5.value];await save();render()};window.addContent=async()=>{toast('업로드중...');let image='https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?auto=format&fit=crop&w=900&q=80';if(postFile.files[0])image=await upload(postFile.files[0]);state.contents.unshift({title:postTitle.value||'NEW CONTENT',desc:postDesc.value||'',image});await save();render();postTitle.value='';postDesc.value='';postFile.value=''};window.delContent=async i=>{state.contents.splice(i,1);await save();render()};async function init(){const snap=await getDoc(ref);if(snap.exists()){const got=snap.data();state={...defaults,...got,nav:got.nav||defaults.nav,artists:got.artists||defaults.artists,contents:got.contents||got.posts||defaults.contents}}else await save();render();onSnapshot(ref,s=>{if(s.exists()){const got=s.data();state={...defaults,...got,nav:got.nav||defaults.nav,artists:got.artists||defaults.artists,contents:got.contents||got.posts||defaults.contents};render()}})}init();</script></body></html>
